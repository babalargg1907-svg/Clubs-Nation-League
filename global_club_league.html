<style>

.grid{display:grid;gap:14px}.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px}.card h3{margin:0 0 12px;font-size:15px}.metric{display:flex;justify-content:space-between;align-items:flex-end}.metric .value{font-size:28px;font-weight:800}.metric .label{color:var(--muted);font-size:12px}.progress{height:8px;background:var(--panel-3);border-radius:999px;overflow:hidden;margin-top:11px}.progress>span{display:block;height:100%;background:var(--accent);width:0}.stepper{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow:auto;padding-bottom:4px}.step{border:1px solid var(--line);background:var(--panel);padding:11px;border-radius:10px;min-height:70px}.step strong{display:block;font-size:12px}.step span{display:block;color:var(--muted);font-size:11px;margin-top:5px}.step.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.step.done{border-color:color-mix(in srgb,var(--good) 65%,var(--line))}.step.done strong{color:var(--good)}

.kpi-list{display:grid;gap:8px}.kpi-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.wizard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.movement-list{display:grid;gap:5px}.movement{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:8px;border-radius:8px;background:var(--panel-2)}
.toast-stack{position:fixed;right:16px;bottom:16px;z-index:300;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);box-shadow:var(--shadow);padding:11px 12px;border-radius:9px}.toast.good{border-left-color:var(--good)}.toast.warn{border-left-color:var(--warn)}.toast.bad{border-left-color:var(--bad)}

<script>
'use strict';

const APP_VERSION='0.1.0';
const SCHEMA_VERSION=1;
const DB_NAME='globalClubLeagueDB';
const DB_VERSION=1;
const LEAGUES=['A','B','C','D','E','F','G','H'];
const GROUPS=[1,2,3,4];
const STORES=['settings','teams','logoConfigs','logoAssets','players','seasons','assignments','matches','goalEvents','cardEvents','injuryEvents','drawRecords','seasonTransitions','auditEntries','aggregateCaches','rollbackSnapshots'];
const STATUS_LABELS={setup:'Kurulum',team_allocation:'Takım Yerleşimi',ready_for_fixture:'Fikstüre Hazır',group_stage:'Grup Aşaması',group_stage_locked:'Gruplar Tamamlandı',final_eights:'Final Eights',final_eights_completed:'Final Eights Tamamlandı',playouts:'Play-out',transition_review:'Sezon Geçişi',ready_for_new_season:'Yeni Sezona Hazır',archived:'Arşiv'};
const STAGES={group:'Grup',qf:'Çeyrek Final',sf:'Yarı Final',final:'Final',playout:'Play-out'};
const state={db:null,activeView:'dashboard',activeSeason:null,teams:[],assignments:[],matches:[],players:[],goalEvents:[],cardEvents:[],injuryEvents:[],draws:[],settings:null,adminUnlocked:false,filters:{teamSearch:'',teamLeague:'all',allocationLeague:'A',fixtureLeague:'all',fixtureGroup:'all',fixtureRound:'all',fixtureStage:'all',fixtureStatus:'all',standingsLeague:'A',standingsGroup:1,statsScope:'season',statsTab:'goals',playoutBoundary:'A-B'},logoUrls:new Map(),pendingMatchId:null,pendingAdminAction:null};

const $=(sel,root=document)=>root.querySelector(sel);
const $$=(sel,root=document)=>[...root.querySelectorAll(sel)];
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const now=()=>new Date().toISOString();
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
const escapeHtml=(s='')=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const normalizeName=s=>String(s||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g,'').trim().replace(/\s+/g,' ').toLowerCase().replace(/ı/g,'i').normalize('NFD').replace(/\u0307/g,'').normalize('NFC');
const slug=s=>normalizeName(s).replace(/[^a-z0-9çğıöşü]+/gi,'-').replace(/^-|-$/g,'');
const shuffle=(arr)=>{const a=[...arr];const buf=new Uint32Array(1);for(let i=a.length-1;i>0;i--){crypto.getRandomValues(buf);const j=buf[0]%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const randomSeed=()=>{const a=new Uint32Array(4);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(8,'0')).join('')};
const formatDate=s=>s?new Intl.DateTimeFormat('tr-TR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(s)):'—';
const teamById=id=>state.teams.find(t=>t.teamId===id);
const assignmentByTeam=id=>state.assignments.find(a=>a.teamId===id);
const matchById=id=>state.matches.find(m=>m.matchId===id);
const stageOrder={group:1,qf:2,sf:3,final:4,playout:5};

function toast(message,type='info',timeout=3600){const el=document.createElement('div');el.className=`toast ${type}`;el.innerHTML=escapeHtml(message);$('#toast-stack').append(el);setTimeout(()=>el.remove(),timeout)}
function confirmAction(message){return window.confirm(message)}
function setBusy(btn,busy,label='İşleniyor…'){if(!btn)return;btn.disabled=busy;if(busy){btn.dataset.oldText=btn.innerHTML;btn.innerHTML=label}else if(btn.dataset.oldText){btn.innerHTML=btn.dataset.oldText;delete btn.dataset.oldText}}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=e=>{const db=e.target.result;const create=(name,keyPath,indexes=[])=>{if(!db.objectStoreNames.contains(name)){const s=db.createObjectStore(name,{keyPath});indexes.forEach(([n,k,opt])=>s.createIndex(n,k,opt||{}))}};
create('settings','settingsId');
create('teams','teamId',[['normalizedName','normalizedName',{unique:true}],['status','status']]);
create('logoConfigs','logoConfigId');create('logoAssets','logoAssetId');
create('players','playerId',[['normalizedName','normalizedName'],['lastSeenAt','lastSeenAt']]);
create('seasons','seasonId',[['seasonNumber','seasonNumber',{unique:true}],['status','status']]);
create('assignments','assignmentId',[['seasonId','seasonId'],['seasonTeam',['seasonId','teamId'],{unique:true}],['seasonLeague',['seasonId','leagueCode']],['seasonGroup',['seasonId','leagueCode','groupNumber']]]);
create('matches','matchId',[['seasonId','seasonId'],['seasonStage',['seasonId','stage']],['seasonGroup',['seasonId','leagueCode','groupNumber']],['sideA','sideATeamId'],['sideB','sideBTeamId'],['status','status'],['boundary','boundaryCode'],['bracketSlot','bracketSlot']]);
create('goalEvents','eventId',[['matchId','matchId'],['seasonId','seasonId'],['playerId','scorerPlayerId'],['teamId','creditedTeamId']]);
create('cardEvents','eventId',[['matchId','matchId'],['seasonId','seasonId'],['playerId','playerId'],['teamId','teamId']]);
create('injuryEvents','eventId',[['matchId','matchId'],['seasonId','seasonId'],['playerId','playerId'],['teamId','teamId']]);
create('drawRecords','drawId',[['seasonId','seasonId'],['drawType','drawType']]);
create('seasonTransitions','transitionId',[['fromSeasonId','fromSeasonId'],['toSeasonId','toSeasonId']]);
create('auditEntries','auditId',[['createdAt','createdAt'],['entityId','entityId']]);
create('aggregateCaches','cacheId');create('rollbackSnapshots','snapshotId',[['createdAt','createdAt']]);};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function tx(storeNames,mode='readonly'){return state.db.transaction(storeNames,mode)}
function dbGet(store,key){return new Promise((res,rej)=>{const r=tx([store]).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbGetAll(store){return new Promise((res,rej)=>{const r=tx([store]).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dbPut(store,value,transaction=null){return new Promise((res,rej)=>{const s=(transaction||tx([store],'readwrite')).objectStore(store);const r=s.put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const r=tx([store],'readwrite').objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbClear(store,transaction=null){return new Promise((res,rej)=>{const s=(transaction||tx([store],'readwrite')).objectStore(store);const r=s.clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function transactionDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('İşlem iptal edildi'))})}
async function audit(action,entityType,entityId,summary,before=null,after=null){await dbPut('auditEntries',{auditId:uid(),action,entityType,entityId,summary,before,after,createdAt:now()})}

async function initialize(){try{state.db=await openDB();await ensureDefaults();await reloadState();bindShell();renderAll();$('#db-health').textContent='IndexedDB hazır';}catch(err){console.error(err);$('#db-health').textContent='Veritabanı hatası';toast('IndexedDB başlatılamadı. Tarayıcı depolama izinlerini kontrol edin.','bad',8000)}}
async function ensureDefaults(){let settings=await dbGet('settings','main');if(!settings){settings={settingsId:'main',databaseId:uid(),activeSeasonId:null,theme:'dark',adminPinHash:null,adminPinSalt:null,autoLockMinutes:15,reducedMotion:false,lastExportedAt:null,createdAt:now(),updatedAt:now()};await dbPut('settings',settings)}let seasons=await dbGetAll('seasons');if(!seasons.length){const season={seasonId:uid(),seasonNumber:1,name:'Sezon 1',ruleVersion:'1.0',status:'team_allocation',createdAt:now(),startedAt:null,completedAt:null,championTeamId:null,fixtureDrawId:null,finalEightsDrawId:null,transitionId:null,revision:1};await dbPut('seasons',season);settings.activeSeasonId=season.seasonId;settings.updatedAt=now();await dbPut('settings',settings)}}
async function reloadState(){state.settings=await dbGet('settings','main');document.documentElement.dataset.theme=state.settings.theme||'dark';const allSeasons=await dbGetAll('seasons');state.activeSeason=allSeasons.find(s=>s.seasonId===state.settings.activeSeasonId)||allSeasons.sort((a,b)=>b.seasonNumber-a.seasonNumber)[0];if(state.activeSeason&&state.settings.activeSeasonId!==state.activeSeason.seasonId){state.settings.activeSeasonId=state.activeSeason.seasonId;await dbPut('settings',state.settings)}const seasonId=state.activeSeason?.seasonId;[state.teams,state.players,state.draws]=await Promise.all([dbGetAll('teams'),dbGetAll('players'),dbGetAll('drawRecords')]);const [assignments,matches,goals,cards,injuries]=await Promise.all([dbGetAll('assignments'),dbGetAll('matches'),dbGetAll('goalEvents'),dbGetAll('cardEvents'),dbGetAll('injuryEvents')]);state.assignments=assignments.filter(x=>x.seasonId===seasonId);state.matches=matches.filter(x=>x.seasonId===seasonId);state.goalEvents=goals.filter(x=>x.seasonId===seasonId);state.cardEvents=cards.filter(x=>x.seasonId===seasonId);state.injuryEvents=injuries.filter(x=>x.seasonId===seasonId);await loadLogoUrls();updatePlayerDatalist();}
async function loadLogoUrls(){for(const url of state.logoUrls.values())URL.revokeObjectURL(url);state.logoUrls.clear();const assets=await dbGetAll('logoAssets');for(const a of assets){if(a.blob instanceof Blob)state.logoUrls.set(a.logoAssetId,URL.createObjectURL(a.blob))}}
function updatePlayerDatalist(){const dl=$('#player-datalist');dl.innerHTML=state.players.filter(p=>p.status!=='merged').sort((a,b)=>a.canonicalName.localeCompare(b.canonicalName,'tr')).map(p=>`<option value="${escapeHtml(p.canonicalName)}"></option>`).join('')}

function bindShell(){
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;switchView(b.dataset.view)});
  $('#menu-toggle').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
  $('#quick-export').addEventListener('click',exportData);
  $('#admin-lock-button').addEventListener('click',()=>state.adminUnlocked?lockAdmin():requestAdminAccess());
  window.addEventListener('click',e=>{if(innerWidth<820&&!$('#sidebar').contains(e.target)&&!$('#menu-toggle').contains(e.target))$('#sidebar').classList.remove('open')});
  let idleTimer;const resetIdle=()=>{clearTimeout(idleTimer);if(state.adminUnlocked){idleTimer=setTimeout(()=>lockAdmin(true),(state.settings.autoLockMinutes||15)*60000)}};['click','keydown','pointerdown'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
}
function switchView(view){state.activeView=view;$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));$$('#nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#sidebar').classList.remove('open');if(view==='admin'&&!state.adminUnlocked){requestAdminAccess();return}renderView(view)}
function renderAll(){updateHeader();['dashboard','teams','allocation','fixtures','standings','finals','playouts','stats','seasons','admin','settings'].forEach(renderView)}
function renderView(v){const fn={dashboard:renderDashboard,teams:renderTeams,allocation:renderAllocation,fixtures:renderFixtures,standings:renderStandings,finals:renderFinals,playouts:renderPlayouts,stats:renderStats,seasons:renderSeasons,admin:renderAdmin,settings:renderSettings}[v];if(fn)fn()}
function updateHeader(){if(!state.activeSeason)return;$('#active-season-label').textContent=state.activeSeason.name;$('#season-status-pill').textContent=STATUS_LABELS[state.activeSeason.status]||state.activeSeason.status;$('#admin-lock-button').innerHTML=state.adminUnlocked?'🔓 <span class="desktop-label">Admin Açık</span>':'🔒 <span class="desktop-label">Admin</span>'}

function renderDashboard(){const teams=state.teams.filter(t=>t.status==='active');const assigned=state.assignments.length;const groupMatches=state.matches.filter(m=>m.stage==='group');const groupFinal=groupMatches.filter(m=>m.status==='final').length;const qf=state.matches.filter(m=>['qf','sf','final'].includes(m.stage));const pl=state.matches.filter(m=>m.stage==='playout');const next=nextRequiredAction();$('#view-dashboard').innerHTML=`
<div class="page-head"><div><h2>Genel Bakış</h2><p>${escapeHtml(state.activeSeason.name)} için turnuva ilerlemesi ve sıradaki işlem.</p></div><button class="btn primary" id="dashboard-next">${escapeHtml(next.label)}</button></div>
<div class="stepper">${seasonSteps().map(s=>`<div class="step ${s.state}"><strong>${s.title}</strong><span>${s.detail}</span></div>`).join('')}</div>
<div class="grid cols-4" style="margin-top:14px">
${metricCard('Takımlar',teams.length,'128 gerekli',teams.length/128)}${metricCard('Yerleşim',assigned,'128 yuva',assigned/128)}${metricCard('Grup Maçları',groupFinal,'192 maç',groupFinal/192)}${metricCard('Eleme + Play-out',qf.filter(m=>m.status==='final').length+pl.filter(m=>m.status==='final').length,`${qf.length+pl.length||35} planlı`,(qf.filter(m=>m.status==='final').length+pl.filter(m=>m.status==='final').length)/Math.max(1,qf.length+pl.length))}
</div>
<div class="grid cols-2" style="margin-top:14px"><div class="card"><h3>Sıradaki gerekli işlem</h3><div class="callout"><div style="font-size:24px">→</div><div><strong>${escapeHtml(next.title)}</strong><div class="muted">${escapeHtml(next.detail)}</div></div></div></div><div class="card"><h3>Veri durumu</h3><div class="kpi-list"><div class="kpi-row"><span>Aktif sezon</span><strong>${escapeHtml(state.activeSeason.name)}</strong></div><div class="kpi-row"><span>Oyuncu havuzu</span><strong>${state.players.filter(p=>p.status!=='merged').length}</strong></div><div class="kpi-row"><span>Son yedek</span><strong>${state.settings.lastExportedAt?formatDate(state.settings.lastExportedAt):'Henüz alınmadı'}</strong></div></div></div></div>
<div class="card" style="margin-top:14px"><h3>Son kesinleşen maçlar</h3>${recentMatchesHtml()}</div>`;
$('#dashboard-next').onclick=()=>switchView(next.view)}
function metricCard(label,value,sub,ratio){return `<div class="card"><div class="metric"><div><div class="label">${label}</div><div class="value">${value}</div></div><div class="small muted">${sub}</div></div><div class="progress"><span style="width:${clamp(ratio*100,0,100)}%"></span></div></div>`}
function seasonSteps(){const teams=state.teams.filter(t=>t.status==='active').length;const assigned=state.assignments.length;const groupFinal=state.matches.filter(m=>m.stage==='group'&&m.status==='final').length;const finalsDone=state.matches.some(m=>m.stage==='final'&&m.status==='final');const plDone=state.matches.filter(m=>m.stage==='playout'&&m.status==='final').length===28;return[
{title:'1. Takımlar',detail:`${teams}/128`,state:teams===128?'done':teams?'active':''},{title:'2. Yerleşim',detail:`${assigned}/128`,state:assigned===128?'done':teams===128?'active':''},{title:'3. Fikstür',detail:state.matches.some(m=>m.stage==='group')?'Çekildi':'Bekliyor',state:state.matches.some(m=>m.stage==='group')?'done':assigned===128?'active':''},{title:'4. Gruplar',detail:`${groupFinal}/192`,state:groupFinal===192?'done':state.matches.some(m=>m.stage==='group')?'active':''},{title:'5. Final Eights',detail:finalsDone?'Tamamlandı':state.matches.some(m=>m.stage==='qf')?'Devam ediyor':'Bekliyor',state:finalsDone?'done':groupFinal===192?'active':''},{title:'6. Play-out',detail:plDone?'Tamamlandı':`${state.matches.filter(m=>m.stage==='playout'&&m.status==='final').length}/28`,state:plDone?'done':groupFinal===192?'active':''},{title:'7. Yeni Sezon',detail:state.activeSeason.status==='ready_for_new_season'?'Hazır':'Bekliyor',state:state.activeSeason.status==='ready_for_new_season'?'active':''}]}
function nextRequiredAction(){const teams=state.teams.filter(t=>t.status==='active').length;if(teams<128)return{label:'Takım ekle',title:'Takım havuzunu tamamlayın',detail:`Fikstürden önce ${128-teams} takım daha oluşturulmalıdır.`,view:'admin'};if(state.assignments.length<128)return{label:'Yerleşimi tamamla',title:'Takımları lig ve gruplara yerleştirin',detail:`${128-state.assignments.length} takım henüz bir gruba atanmamış.`,view:'admin'};if(!state.matches.some(m=>m.stage==='group'))return{label:'Fikstürü çek',title:'Grup fikstürünü oluşturun',detail:'32 grup için 192 geçerli maç oluşturulacak.',view:'admin'};const gf=state.matches.filter(m=>m.stage==='group'&&m.status==='final').length;if(gf<192)return{label:'Maç sonuçlarına git',title:'Grup maçlarını tamamlayın',detail:`${192-gf} grup maçı sonuç bekliyor.`,view:'fixtures'};if(!state.matches.some(m=>m.stage==='qf'))return{label:'Kuraları aç',title:'Final Eights ve play-out kuralarını çekin',detail:'Grup sıralamaları artık kesinleştirilebilir.',view:'admin'};if(!state.matches.some(m=>m.stage==='final'&&m.status==='final'))return{label:'Final Eights',title:'A Ligi şampiyonunu belirleyin',detail:'Çeyrek final, yarı final ve final sonuçlarını tamamlayın.',view:'finals'};if(state.matches.filter(m=>m.stage==='playout'&&m.status==='final').length<28)return{label:'Play-out',title:'Play-out maçlarını tamamlayın',detail:'Yeni sezon lig üyelikleri için 28 maçın tamamı gerekli.',view:'playouts'};return{label:'Sezon geçişi',title:'Yeni sezonu oluşturun',detail:'Bütün sportif sonuçlar tamamlandı.',view:'admin'}}
function recentMatchesHtml(){const rows=state.matches.filter(m=>m.status==='final').sort((a,b)=>String(b.finalizedAt).localeCompare(String(a.finalizedAt))).slice(0,8);if(!rows.length)return'<div class="empty">Henüz kesinleşmiş maç bulunmuyor.</div>';return`<div class="table-wrap responsive"><table><thead><tr><th>Aşama</th><th>Takım A</th><th>Skor</th><th>Takım B</th><th>Tarih</th></tr></thead><tbody>${rows.map(m=>`<tr><td data-label="Aşama">${STAGES[m.stage]}</td><td data-label="Takım A">${teamName(m.sideATeamId)}</td><td data-label="Skor"><strong>${scoreText(m)}</strong></td><td data-label="Takım B">${teamName(m.sideBTeamId)}</td><td data-label="Tarih">${formatDate(m.finalizedAt)}</td></tr>`).join('')}</tbody></table></div>`}

function renderTeams(){const q=normalizeName(state.filters.teamSearch);const teams=state.teams.filter(t=>t.status==='active').filter(t=>!q||normalizeName(t.name).includes(q)).filter(t=>state.filters.teamLeague==='all'||assignmentByTeam(t.teamId)?.leagueCode===state.filters.teamLeague).sort((a,b)=>a.name.localeCompare(b.name,'tr'));$('#view-teams').innerHTML=`<div class="page-head"><div><h2>Takımlar</h2><p>128 takımlık global kulüp havuzu.</p></div><button class="btn primary" id="goto-team-admin">Takım oluştur</button></div><div class="toolbar"><input id="team-search" placeholder="Takım ara…" value="${escapeHtml(state.filters.teamSearch)}" style="max-width:300px"><select id="team-league-filter" style="max-width:180px"><option value="all">Tüm ligler</option>${LEAGUES.map(l=>`<option value="${l}" ${state.filters.teamLeague===l?'selected':''}>${l} Ligi</option>`).join('')}</select><span class="badge info">${teams.length} takım gösteriliyor</span></div>${teams.length?`<div class="team-grid">${teams.map(teamCardHtml).join('')}</div>`:'<div class="empty">Filtreye uyan takım yok.</div>'}`;
$('#goto-team-admin').onclick=()=>{switchView('admin');setTimeout(()=>$('#team-name')?.focus(),50)};$('#team-search').oninput=e=>{state.filters.teamSearch=e.target.value;renderTeams()};$('#team-league-filter').onchange=e=>{state.filters.teamLeague=e.target.value;renderTeams()}}
function teamCardHtml(t){const a=assignmentByTeam(t.teamId);return `<div class="team-card">${logoHtml(t)}<div class="grow"><strong>${escapeHtml(t.name)}</strong><span class="small muted">${a?`${a.leagueCode}${a.groupNumber}`:'Atanmamış'}</span></div></div>`}
function teamName(id){return teamById(id)?.name||'Belirlenecek'}
function logoHtml(team,size=''){if(!team)return`<div class="logo ${size}"></div>`;if(team.logoType==='uploaded'){const url=state.logoUrls.get(team.logoAssetId);return `<div class="logo ${size}">${url?`<img src="${url}" alt="">`:''}</div>`}return `<div class="logo ${size}">${generatedLogoSvg(team.logoConfig||defaultLogoConfig(team.name))}</div>`}
function defaultLogoConfig(name='TK'){const initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase().slice(0,2)||'TK';const palette=[['#2563eb','#0f172a'],['#dc2626','#111827'],['#16a34a','#052e16'],['#7c3aed','#1e1b4b'],['#ea580c','#431407'],['#0891b2','#083344']];const pair=palette[Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length];return{shape:'shield',primaryColor:pair[0],secondaryColor:pair[1],borderColor:'#f8fafc',pattern:'split',initials,textColor:'#ffffff'}}
function generatedLogoSvg(c){const clipId=`clip-${Math.random().toString(36).slice(2,10)}`;const shape=c.shape||'shield';const path=shape==='circle'?'<circle cx="50" cy="50" r="43"/>':shape==='hexagon'?'<path d="M50 5 88 27v46L50 95 12 73V27z"/>':'<path d="M12 8h76v50c0 21-16 31-38 39C28 89 12 79 12 58z"/>';const clip=shape==='circle'?'<circle cx="50" cy="50" r="43"/>':shape==='hexagon'?'<path d="M50 5 88 27v46L50 95 12 73V27z"/>':'<path d="M12 8h76v50c0 21-16 31-38 39C28 89 12 79 12 58z"/>';let pattern='';if(c.pattern==='split')pattern=`<rect x="50" width="50" height="100" fill="var(--secondary)" clip-path="url(#${clipId})"/>`;if(c.pattern==='stripes')pattern=`<g clip-path="url(#${clipId})" fill="var(--secondary)"><rect x="20" width="15" height="100"/><rect x="50" width="15" height="100"/><rect x="80" width="15" height="100"/></g>`;return `<svg viewBox="0 0 100 100" role="img" aria-label="Kulüp arması" style="--secondary:${c.secondaryColor}"><defs><clipPath id="${clipId}">${clip}</clipPath></defs><g fill="${c.primaryColor}" stroke="${c.borderColor}" stroke-width="4">${path}</g>${pattern}<text x="50" y="59" text-anchor="middle" font-size="26" font-weight="900" fill="${c.textColor||'#fff'}" stroke="rgba(0,0,0,.25)" stroke-width="1">${escapeHtml(c.initials||'TK')}</text></svg>`}

function renderAllocation(){const l=state.filters.allocationLeague;$('#view-allocation').innerHTML=`<div class="page-head"><div><h2>Lig ve Grup Yerleşimi</h2><p>Bu görünüm salt okunurdur. Değişiklikler Admin Paneli üzerinden yapılır.</p></div><button class="btn primary" id="allocation-admin">Admin yerleşim aracı</button></div><div class="league-tabs">${LEAGUES.map(x=>`<button class="${x===l?'active':''}" data-league="${x}">${x} Ligi</button>`).join('')}</div>${groupsHtml(l,false)}`;$$('[data-league]',$('#view-allocation')).forEach(b=>b.onclick=()=>{state.filters.allocationLeague=b.dataset.league;renderAllocation()});$('#allocation-admin').onclick=()=>switchView('admin')}
function groupsHtml(league,editable=false){return `<div class="groups-grid">${GROUPS.map(g=>{const list=state.assignments.filter(a=>a.leagueCode===league&&a.groupNumber===g).sort((a,b)=>a.slotNumber-b.slotNumber);return `<div class="group-card"><div class="group-title"><strong>${league}${g}</strong><span class="badge ${list.length===4?'good':'warn'}">${list.length}/4</span></div>${[1,2,3,4].map(slot=>{const a=list.find(x=>x.slotNumber===slot);const t=a&&teamById(a.teamId);return t?`<div class="slot">${logoHtml(t)}<div class="grow"><strong>${escapeHtml(t.name)}</strong><span class="small muted">Yuva ${slot}</span></div>${editable?`<button class="btn small-btn ghost" data-remove-assignment="${a.assignmentId}">×</button>`:''}</div>`:`<div class="slot empty-slot">Boş yuva ${slot}</div>`}).join('')}</div>`}).join('')}</div>`}

function renderFixtures(){const f=state.filters;const leagueOpts=LEAGUES.map(l=>`<option value="${l}" ${f.fixtureLeague===l?'selected':''}>${l} Ligi</option>`).join('');let rows=state.matches.filter(m=>(f.fixtureStage==='all'||m.stage===f.fixtureStage)&&(f.fixtureLeague==='all'||m.leagueCode===f.fixtureLeague)&&(f.fixtureGroup==='all'||String(m.groupNumber)===f.fixtureGroup)&&(f.fixtureRound==='all'||String(m.roundNumber)===f.fixtureRound)&&(f.fixtureStatus==='all'||m.status===f.fixtureStatus)).sort((a,b)=>(stageOrder[a.stage]-stageOrder[b.stage])||(a.leagueCode||'').localeCompare(b.leagueCode||'')||(a.groupNumber||0)-(b.groupNumber||0)||(a.roundNumber||0)-(b.roundNumber||0)||(a.displayOrder||0)-(b.displayOrder||0));$('#view-fixtures').innerHTML=`<div class="page-head"><div><h2>Fikstür</h2><p>Grup, Final Eights ve play-out maçları.</p></div></div><div class="toolbar"><select id="fixture-stage"><option value="all">Tüm aşamalar</option>${Object.entries(STAGES).map(([k,v])=>`<option value="${k}" ${f.fixtureStage===k?'selected':''}>${v}</option>`).join('')}</select><select id="fixture-league"><option value="all">Tüm ligler</option>${leagueOpts}</select><select id="fixture-group"><option value="all">Tüm gruplar</option>${GROUPS.map(g=>`<option ${f.fixtureGroup===String(g)?'selected':''}>${g}</option>`).join('')}</select><select id="fixture-round"><option value="all">Tüm haftalar/turlar</option>${[1,2,3,4].map(g=>`<option ${f.fixtureRound===String(g)?'selected':''}>${g}</option>`).join('')}</select><select id="fixture-status"><option value="all">Tüm durumlar</option><option value="scheduled" ${f.fixtureStatus==='scheduled'?'selected':''}>Planlandı</option><option value="draft" ${f.fixtureStatus==='draft'?'selected':''}>Taslak</option><option value="final" ${f.fixtureStatus==='final'?'selected':''}>Kesinleşti</option></select><span class="badge info">${rows.length} maç</span></div>${rows.length?fixtureTable(rows):'<div class="empty">Henüz maç oluşturulmadı veya filtreye uyan maç yok.</div>'}`;
[['fixture-stage','fixtureStage'],['fixture-league','fixtureLeague'],['fixture-group','fixtureGroup'],['fixture-round','fixtureRound'],['fixture-status','fixtureStatus']].forEach(([id,key])=>$('#'+id).onchange=e=>{state.filters[key]=e.target.value;renderFixtures()});$$('[data-edit-match]',$('#view-fixtures')).forEach(b=>b.onclick=()=>openMatchEditor(b.dataset.editMatch))}
function fixtureTable(rows){return `<div class="table-wrap responsive"><table><thead><tr><th>No</th><th>Aşama</th><th>Lig/Grup</th><th>Hafta</th><th>Takım A</th><th>Skor</th><th>Takım B</th><th>Durum</th><th></th></tr></thead><tbody>${rows.map((m,i)=>`<tr><td data-label="No">${i+1}</td><td data-label="Aşama">${STAGES[m.stage]}</td><td data-label="Lig/Grup">${m.stage==='playout'?m.boundaryCode:(m.leagueCode||'')+(m.groupNumber||'')}</td><td data-label="Hafta">${m.roundNumber||'—'}</td><td data-label="Takım A"><div class="team-cell">${logoHtml(teamById(m.sideATeamId))}<span>${escapeHtml(teamName(m.sideATeamId))}</span></div></td><td data-label="Skor"><strong>${scoreText(m)}</strong></td><td data-label="Takım B"><div class="team-cell">${logoHtml(teamById(m.sideBTeamId))}<span>${escapeHtml(teamName(m.sideBTeamId))}</span></div></td><td data-label="Durum">${matchStatusBadge(m)}</td><td><button class="btn small-btn" data-edit-match="${m.matchId}">Maçı Düzenle</button></td></tr>`).join('')}</tbody></table></div>`}
function scoreText(m){if(m.status==='scheduled')return'—';let s=`${m.scoreA??0} - ${m.scoreB??0}`;if(m.penaltyScoreA!=null)s+=` (${m.penaltyScoreA}-${m.penaltyScoreB} pen.)`;return s}
function matchStatusBadge(m){return m.status==='final'?'<span class="badge good">Kesinleşti</span>':m.status==='draft'?'<span class="badge warn">Taslak</span>':'<span class="badge">Planlandı</span>'}

async function standingsForGroup(league,group,seasonId=state.activeSeason.seasonId){const allAssignments=(seasonId===state.activeSeason.seasonId?state.assignments:(await dbGetAll('assignments')).filter(a=>a.seasonId===seasonId)).filter(a=>a.leagueCode===league&&a.groupNumber===group);const allMatches=(seasonId===state.activeSeason.seasonId?state.matches:(await dbGetAll('matches')).filter(m=>m.seasonId===seasonId)).filter(m=>m.stage==='group'&&m.leagueCode===league&&m.groupNumber===group&&m.status==='final');const cards=(seasonId===state.activeSeason.seasonId?state.cardEvents:(await dbGetAll('cardEvents')).filter(e=>e.seasonId===seasonId));const table=new Map(allAssignments.map(a=>[a.teamId,{teamId:a.teamId,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0,points:0,fairPlay:0,lotNumber:a.lotNumber||9999}]));for(const m of allMatches){const a=table.get(m.sideATeamId),b=table.get(m.sideBTeamId);if(!a||!b)continue;a.played++;b.played++;a.gf+=m.scoreA;a.ga+=m.scoreB;b.gf+=m.scoreB;b.ga+=m.scoreA;if(m.scoreA>m.scoreB){a.wins++;b.losses++;a.points+=3}else if(m.scoreA<m.scoreB){b.wins++;a.losses++;b.points+=3}else{a.draws++;b.draws++;a.points++;b.points++}}for(const r of table.values())r.gd=r.gf-r.ga;for(const e of cards){const m=allMatches.find(x=>x.matchId===e.matchId);if(!m)continue;const r=table.get(e.teamId);if(!r)continue;r.fairPlay+=cardWeight(e,cards.filter(x=>x.matchId===e.matchId&&x.playerId===e.playerId))}const rows=[...table.values()];return rankRows(rows,allMatches)}
function cardWeight(e,playerMatchCards){if(e.cardType==='yellow')return 1;if(e.cardType==='directRed')return 5;if(e.cardType==='secondYellowRed')return playerMatchCards.some(x=>x.cardType==='yellow')?2:3;return 0}
function rankRows(rows,matches){const byPoints=new Map();rows.forEach(r=>{if(!byPoints.has(r.points))byPoints.set(r.points,[]);byPoints.get(r.points).push(r)});const pointsGroups=[...byPoints.entries()].sort((a,b)=>b[0]-a[0]);const result=[];for(const [,group] of pointsGroups){if(group.length===1){result.push(group[0]);continue}for(const r of group){const ids=new Set(group.map(x=>x.teamId));let gd=0;for(const m of matches.filter(m=>ids.has(m.sideATeamId)&&ids.has(m.sideBTeamId))){if(m.sideATeamId===r.teamId)gd+=m.scoreA-m.scoreB;else if(m.sideBTeamId===r.teamId)gd+=m.scoreB-m.scoreA}r.h2hGd=gd}group.sort((a,b)=>(b.h2hGd-a.h2hGd)||(b.gd-a.gd)||(b.gf-a.gf)||(a.fairPlay-b.fairPlay)||(a.lotNumber-b.lotNumber));result.push(...group)}return result}
function renderStandings(){const l=state.filters.standingsLeague,g=state.filters.standingsGroup;$('#view-standings').innerHTML=`<div class="page-head"><div><h2>Puan Durumu</h2><p>Puan, ikili averaj, genel averaj, atılan gol, Fair Play ve kura numarası sırasıyla uygulanır.</p></div></div><div class="league-tabs">${LEAGUES.map(x=>`<button class="${x===l?'active':''}" data-sleague="${x}">${x} Ligi</button>`).join('')}</div><div class="subtabs">${GROUPS.map(x=>`<button class="${x===g?'active':''}" data-sgroup="${x}">Grup ${x}</button>`).join('')}</div><div id="standings-table"><div class="empty">Hesaplanıyor…</div></div>`;$$('[data-sleague]').forEach(b=>b.onclick=()=>{state.filters.standingsLeague=b.dataset.sleague;renderStandings()});$$('[data-sgroup]').forEach(b=>b.onclick=()=>{state.filters.standingsGroup=Number(b.dataset.sgroup);renderStandings()});standingsForGroup(l,g).then(rows=>{$('#standings-table').innerHTML=rows.length?`<div class="table-wrap responsive"><table><thead><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AG</th><th>YG</th><th>AV</th><th>P</th><th>Fair Play</th><th>Durum</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td data-label="#" class="rank">${i+1}</td><td data-label="Takım"><div class="team-cell">${logoHtml(teamById(r.teamId))}<span>${escapeHtml(teamName(r.teamId))}</span></div></td><td data-label="O">${r.played}</td><td data-label="G">${r.wins}</td><td data-label="B">${r.draws}</td><td data-label="M">${r.losses}</td><td data-label="AG">${r.gf}</td><td data-label="YG">${r.ga}</td><td data-label="AV">${r.gd}</td><td data-label="P"><strong>${r.points}</strong></td><td data-label="Fair Play">${r.fairPlay}</td><td data-label="Durum">${positionBadge(l,i+1)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Bu grupta takım bulunmuyor.</div>'})}
function positionBadge(l,pos){if(l==='A')return pos<=2?'<span class="badge good">Final Eights</span>':pos===3?'<span class="badge warn">Play-out</span>':'<span class="badge bad">B Ligi’ne düşer</span>';if(l==='H')return pos===1?'<span class="badge good">Doğrudan yükselir</span>':pos===2?'<span class="badge warn">Play-out</span>':'<span class="badge">Ligde kalır</span>';return pos===1?'<span class="badge good">Doğrudan yükselir</span>':pos===2?'<span class="badge info">Üst lig play-out</span>':pos===3?'<span class="badge warn">Alt lig play-out</span>':'<span class="badge bad">Doğrudan düşer</span>'}

function renderFinals(){const matches=state.matches.filter(m=>['qf','sf','final'].includes(m.stage));const qf=matches.filter(m=>m.stage==='qf').sort((a,b)=>a.displayOrder-b.displayOrder),sf=matches.filter(m=>m.stage==='sf').sort((a,b)=>a.displayOrder-b.displayOrder),fin=matches.find(m=>m.stage==='final');const champ=fin?.winnerTeamId?teamById(fin.winnerTeamId):null;$('#view-finals').innerHTML=`<div class="page-head"><div><h2>A Ligi Final Eights</h2><p>Grup birincileri seribaşıdır; aynı grubun ikincisiyle çeyrek finalde eşleşemez.</p></div></div>${matches.length?`<div class="table-wrap"><div class="bracket"><div class="round"><h3>Çeyrek Finaller</h3>${[0,1,2,3].map(i=>bracketMatch(qf[i],`QF${i+1}`)).join('')}</div><div class="round sf"><h3>Yarı Finaller</h3>${[0,1].map(i=>bracketMatch(sf[i],`SF${i+1}`)).join('')}</div><div class="round final"><h3>Final</h3>${bracketMatch(fin,'Final')}${champ?`<div class="champion-card">${logoHtml(champ,'lg')}<h3>${escapeHtml(champ.name)}</h3><span class="badge good">${escapeHtml(state.activeSeason.name)} Şampiyonu</span></div>`:''}</div></div></div>`:'<div class="empty">Final Eights kurası henüz çekilmedi.</div>'}`;$$('[data-bracket-match]').forEach(b=>b.onclick=()=>openMatchEditor(b.dataset.bracketMatch))}
function bracketMatch(m,label){if(!m)return`<div class="match-card"><div class="small muted">${label}</div><div class="match-side">Belirlenecek</div><div class="match-side">Belirlenecek</div></div>`;return `<button class="match-card" style="color:inherit;text-align:left" data-bracket-match="${m.matchId}"><div class="small muted">${label}</div><div class="match-side ${m.winnerTeamId===m.sideATeamId?'winner':''}"><span>${escapeHtml(teamName(m.sideATeamId))}</span><strong>${m.status==='scheduled'?'—':m.scoreA}</strong></div><div class="match-side ${m.winnerTeamId===m.sideBTeamId?'winner':''}"><span>${escapeHtml(teamName(m.sideBTeamId))}</span><strong>${m.status==='scheduled'?'—':m.scoreB}</strong></div>${m.penaltyScoreA!=null?`<div class="small muted">Penaltılar: ${m.penaltyScoreA}-${m.penaltyScoreB}</div>`:''}</button>`}

function renderPlayouts(){const b=state.filters.playoutBoundary;const boundaries=['A-B','B-C','C-D','D-E','E-F','F-G','G-H'];const rows=state.matches.filter(m=>m.stage==='playout'&&m.boundaryCode===b).sort((a,c)=>a.displayOrder-c.displayOrder);$('#view-playouts').innerHTML=`<div class="page-head"><div><h2>Play-out</h2><p>Üst lig üçüncüleri ile alt lig ikincileri tek maç üzerinden karşılaşır.</p></div></div><div class="subtabs">${boundaries.map(x=>`<button class="${x===b?'active':''}" data-boundary="${x}">${x}</button>`).join('')}</div>${rows.length?`<div class="grid cols-2">${rows.map(m=>`<div class="match-card"><div class="small muted">${m.boundaryCode} · Play-out ${m.displayOrder}</div><div class="match-side ${m.winnerTeamId===m.sideATeamId?'winner':''}"><span>${escapeHtml(teamName(m.sideATeamId))}</span><strong>${m.status==='scheduled'?'—':m.scoreA}</strong></div><div class="match-side ${m.winnerTeamId===m.sideBTeamId?'winner':''}"><span>${escapeHtml(teamName(m.sideBTeamId))}</span><strong>${m.status==='scheduled'?'—':m.scoreB}</strong></div>${m.status==='final'?`<div class="alert good small">${escapeHtml(playoutOutcomeText(m))}</div>`:''}<button class="btn small-btn" data-edit-match="${m.matchId}">Maçı Düzenle</button></div>`).join('')}</div>`:'<div class="empty">Bu lig sınırı için play-out kurası henüz çekilmedi.</div>'}`;$$('[data-boundary]').forEach(x=>x.onclick=()=>{state.filters.playoutBoundary=x.dataset.boundary;renderPlayouts()});$$('[data-edit-match]',$('#view-playouts')).forEach(x=>x.onclick=()=>openMatchEditor(x.dataset.editMatch))}
function playoutOutcomeText(m){if(!m.winnerTeamId)return'';const [upper,lower]=m.boundaryCode.split('-');const upperTeam=m.sideATeamId,lowerTeam=m.sideBTeamId;return m.winnerTeamId===upperTeam?`${teamName(upperTeam)} ${upper} Ligi’nde kaldı; ${teamName(lowerTeam)} ${lower} Ligi’nde kaldı.`:`${teamName(lowerTeam)} ${upper} Ligi’ne yükseldi; ${teamName(upperTeam)} ${lower} Ligi’ne düştü.`}

function renderStats(){const tab=state.filters.statsTab;$('#view-stats').innerHTML=`<div class="page-head"><div><h2>İstatistikler</h2><p>Kesinleşmiş maçlar üzerinden sezonluk veya tüm zamanlar hesaplanır.</p></div></div><div class="toolbar"><select id="stats-scope"><option value="season" ${state.filters.statsScope==='season'?'selected':''}>Aktif sezon</option><option value="all" ${state.filters.statsScope==='all'?'selected':''}>Tüm zamanlar</option></select></div><div class="subtabs">${[['goals','Gol Krallığı'],['assists','Asist Krallığı'],['cards','Disiplin'],['injuries','Sakatlıklar'],['fairplay','Takım Fair Play']].map(([k,v])=>`<button class="${tab===k?'active':''}" data-stat-tab="${k}">${v}</button>`).join('')}</div><div id="stats-content"><div class="empty">Hesaplanıyor…</div></div>`;$('#stats-scope').onchange=e=>{state.filters.statsScope=e.target.value;renderStats()};$$('[data-stat-tab]').forEach(b=>b.onclick=()=>{state.filters.statsTab=b.dataset.statTab;renderStats()});loadStats(tab,state.filters.statsScope).then(html=>$('#stats-content').innerHTML=html)}
async function loadStats(tab,scope){const seasonId=scope==='season'?state.activeSeason.seasonId:null;const [goals,cards,injuries,players,teams,matches]=await Promise.all([dbGetAll('goalEvents'),dbGetAll('cardEvents'),dbGetAll('injuryEvents'),dbGetAll('players'),dbGetAll('teams'),dbGetAll('matches')]);const finalIds=new Set(matches.filter(m=>m.status==='final'&&(!seasonId||m.seasonId===seasonId)).map(m=>m.matchId));const gs=goals.filter(e=>finalIds.has(e.matchId)&&(!seasonId||e.seasonId===seasonId));const cs=cards.filter(e=>finalIds.has(e.matchId)&&(!seasonId||e.seasonId===seasonId));const ins=injuries.filter(e=>finalIds.has(e.matchId)&&(!seasonId||e.seasonId===seasonId));const pmap=new Map(players.map(p=>[p.playerId,p]));const tmap=new Map(teams.map(t=>[t.teamId,t]));if(tab==='goals'){const map=new Map();for(const e of gs){if(!e.scorerPlayerId||e.goalType==='ownGoal'||e.goalType==='unknown')continue;map.set(e.scorerPlayerId,(map.get(e.scorerPlayerId)||0)+1)}return statTable([...map].sort((a,b)=>b[1]-a[1]).map(([id,n],i)=>[i+1,pmap.get(id)?.canonicalName||'Bilinmeyen',n]),'Gol')}
if(tab==='assists'){const map=new Map();for(const e of gs){if(!e.assistPlayerId)continue;map.set(e.assistPlayerId,(map.get(e.assistPlayerId)||0)+1)}return statTable([...map].sort((a,b)=>b[1]-a[1]).map(([id,n],i)=>[i+1,pmap.get(id)?.canonicalName||'Bilinmeyen',n]),'Asist')}
if(tab==='cards'){const map=new Map();for(const e of cs){if(!map.has(e.playerId))map.set(e.playerId,{y:0,s:0,r:0,p:0});const x=map.get(e.playerId);if(e.cardType==='yellow')x.y++;if(e.cardType==='secondYellowRed')x.s++;if(e.cardType==='directRed')x.r++;x.p+=cardWeight(e,cs.filter(z=>z.matchId===e.matchId&&z.playerId===e.playerId))}const rows=[...map].sort((a,b)=>b[1].p-a[1].p);return rows.length?`<div class="table-wrap responsive"><table><thead><tr><th>#</th><th>Oyuncu</th><th>Sarı</th><th>Çift Sarı-Kırmızı</th><th>Direkt Kırmızı</th><th>Ceza Puanı</th></tr></thead><tbody>${rows.map(([id,x],i)=>`<tr><td data-label="#">${i+1}</td><td data-label="Oyuncu">${escapeHtml(pmap.get(id)?.canonicalName||'Bilinmeyen')}</td><td data-label="Sarı">${x.y}</td><td data-label="Çift Sarı">${x.s}</td><td data-label="Direkt Kırmızı">${x.r}</td><td data-label="Puan"><strong>${x.p}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Kart kaydı yok.</div>'}
if(tab==='injuries'){return ins.length?`<div class="table-wrap responsive"><table><thead><tr><th>Oyuncu</th><th>Takım</th><th>Dakika</th><th>Not</th><th>Tarih</th></tr></thead><tbody>${ins.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).map(e=>`<tr><td data-label="Oyuncu">${escapeHtml(pmap.get(e.playerId)?.canonicalName||e.playerNameSnapshot)}</td><td data-label="Takım">${escapeHtml(tmap.get(e.teamId)?.name||'—')}</td><td data-label="Dakika">${minuteText(e)}</td><td data-label="Not">${escapeHtml(e.notes||'—')}</td><td data-label="Tarih">${formatDate(e.createdAt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Sakatlık kaydı yok.</div>'}
if(tab==='fairplay'){const map=new Map();for(const e of cs)map.set(e.teamId,(map.get(e.teamId)||0)+cardWeight(e,cs.filter(z=>z.matchId===e.matchId&&z.playerId===e.playerId)));return statTable([...map].sort((a,b)=>a[1]-b[1]).map(([id,n],i)=>[i+1,tmap.get(id)?.name||'Bilinmeyen',n]),'Ceza Puanı')}
return''}
function statTable(rows,label){return rows.length?`<div class="table-wrap responsive"><table><thead><tr><th>#</th><th>Ad</th><th>${label}</th></tr></thead><tbody>${rows.map(r=>`<tr><td data-label="#">${r[0]}</td><td data-label="Ad">${escapeHtml(r[1])}</td><td data-label="${label}"><strong>${r[2]}</strong></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Henüz kayıt yok.</div>`}

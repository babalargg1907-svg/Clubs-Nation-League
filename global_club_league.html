function wireAdmin(activeTeams,groupMatchesExist){$('#lock-admin-now').onclick=()=>lockAdmin();const form=$('#team-form');const updatePreview=()=>{const c={shape:$('#logo-shape').value,pattern:$('#logo-pattern').value,primaryColor:$('#logo-primary').value,secondaryColor:$('#logo-secondary').value,borderColor:$('#logo-border').value,initials:($('#logo-initials').value||'TK').toUpperCase(),textColor:'#fff'};$('#logo-preview').innerHTML=`<div class="logo lg">${generatedLogoSvg(c)}</div>`};['logo-shape','logo-pattern','logo-primary','logo-secondary','logo-border','logo-initials'].forEach(id=>$('#'+id).oninput=updatePreview);$('#team-name').oninput=e=>{const initials=e.target.value.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase().slice(0,2);if(initials){$('#logo-initials').value=initials;updatePreview()}};$('#logo-type').onchange=e=>{$('#generated-logo-fields').classList.toggle('hidden',e.target.value!=='generated');$('#uploaded-logo-fields').classList.toggle('hidden',e.target.value!=='uploaded')};updatePreview();form.onsubmit=saveTeam;$('#draw-fixtures').onclick=drawFixtures;$('#draw-finals').onclick=drawFinalEights;$('#draw-playouts').onclick=drawPlayouts;$('#season-transition').onclick=openSeasonTransition;$('#merge-players').onclick=openMergePlayers;$('#health-check').onclick=runHealthCheck;$$('[data-admin-league]').forEach(b=>b.onclick=()=>{state.filters.allocationLeague=b.dataset.adminLeague;renderAdmin()});$$('[data-remove-assignment]').forEach(b=>b.onclick=()=>removeAssignment(b.dataset.removeAssignment));if(!groupMatchesExist){$('#assign-button').onclick=assignSelectedTeam}}

async function saveTeam(e){e.preventDefault();const name=$('#team-name').value.trim().replace(/\s+/g,' ');if(!name)return toast('Takım adı zorunludur.','bad');if(state.teams.some(t=>t.normalizedName===normalizeName(name)&&t.status==='active'))return toast('Bu takım adı daha önce kullanılmış.','bad');if(state.teams.filter(t=>t.status==='active').length>=128)return toast('Aktif takım havuzu 128 takımla sınırlıdır.','bad');const type=$('#logo-type').value;const team={teamId:uid(),name,normalizedName:normalizeName(name),shortName:$('#team-short').value.trim(),logoType:type,status:'active',createdAt:now(),updatedAt:now(),revision:1};if(type==='generated'){team.logoConfig={shape:$('#logo-shape').value,pattern:$('#logo-pattern').value,primaryColor:$('#logo-primary').value,secondaryColor:$('#logo-secondary').value,borderColor:$('#logo-border').value,initials:($('#logo-initials').value||name.slice(0,2)).toUpperCase().slice(0,2),textColor:'#fff'}}else{const file=$('#logo-file').files[0];if(!file)return toast('Logo görseli seçilmelidir.','bad');if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('Yalnızca PNG, JPEG veya WebP yüklenebilir.','bad');const blob=await resizeImage(file,256,256);team.logoAssetId=uid();await dbPut('logoAssets',{logoAssetId:team.logoAssetId,mimeType:blob.type,blob,fileSize:blob.size,createdAt:now()})}await dbPut('teams',team);await audit('create','team',team.teamId,`${name} oluşturuldu`,null,team);await reloadState();renderAll();toast(`${name} oluşturuldu.`,'good')}
function resizeImage(file,maxW,maxH){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error('Görsel dönüştürülemedi'))},'image/webp',.86)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Görsel açılamadı'))};img.src=url})}
async function assignSelectedTeam(){const teamId=$('#assign-team').value,league=$('#assign-league').value,group=Number($('#assign-group').value),slot=Number($('#assign-slot').value);if(!teamId)return toast('Takım seçin.','warn');if(state.assignments.some(a=>a.leagueCode===league&&a.groupNumber===group&&a.slotNumber===slot))return toast(`${league}${group} grubundaki ${slot}. yuva dolu.`,'bad');if(assignmentByTeam(teamId))return toast('Takım zaten atanmış.','bad');const a={assignmentId:uid(),seasonId:state.activeSeason.seasonId,teamId,leagueCode:league,groupNumber:group,slotNumber:slot,sourceType:'manual',sourceDrawId:null,teamNameSnapshot:teamName(teamId),logoSnapshot:null,lotNumber:randomLot(),createdAt:now(),updatedAt:now()};await dbPut('assignments',a);await audit('assign','assignment',a.assignmentId,`${teamName(teamId)} ${league}${group} grubuna yerleştirildi`,null,a);await reloadState();renderAll();toast('Takım yerleştirildi.','good')}
function randomLot(){const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]}
async function removeAssignment(id){const a=state.assignments.find(x=>x.assignmentId===id);if(!a)return;if(!confirmAction(`${teamName(a.teamId)} takımının ataması kaldırılsın mı?`))return;await dbDelete('assignments',id);await audit('remove','assignment',id,'Takım ataması kaldırıldı',a,null);await reloadState();renderAll()}

async function drawFixtures(){const btn=$('#draw-fixtures');setBusy(btn,true);try{const check=validateAllocation();if(!check.ok)throw new Error(check.errors.join(' '));const drawId=uid(),seed=randomSeed();const created=[];for(const league of LEAGUES){for(const group of GROUPS){const ids=shuffle(state.assignments.filter(a=>a.leagueCode===league&&a.groupNumber===group).map(a=>a.teamId));const rounds=shuffle([[[ids[0],ids[3]],[ids[1],ids[2]]],[[ids[0],ids[2]],[ids[3],ids[1]]],[[ids[0],ids[1]],[ids[2],ids[3]]]]);rounds.forEach((pairs,ri)=>pairs.forEach((pair,mi)=>{const flip=shuffle([true,false])[0];created.push({matchId:uid(),seasonId:state.activeSeason.seasonId,stage:'group',leagueCode:league,groupNumber:group,boundaryCode:null,roundNumber:ri+1,bracketSlot:null,displayOrder:mi+1,sideATeamId:flip?pair[1]:pair[0],sideBTeamId:flip?pair[0]:pair[1],status:'scheduled',scoreA:null,scoreB:null,penaltyScoreA:null,penaltyScoreB:null,winnerTeamId:null,statisticsComplete:false,finalizedAt:null,drawRecordId:drawId,revision:1})}))}}const validation=validateFixtureList(created);if(!validation.ok)throw new Error(validation.errors.join(' '));const tr=tx(['matches','drawRecords','seasons','auditEntries'],'readwrite');for(const m of created)tr.objectStore('matches').put(m);const draw={drawId,seasonId:state.activeSeason.seasonId,drawType:'group_fixture',participants:state.assignments.map(a=>a.teamId),pots:null,constraints:['Her takım haftada bir maç','Her eşleşme bir kez'],randomSeed:seed,algorithmVersion:'round-robin-1.0',result:created.map(m=>m.matchId),createdAt:now(),lockedAt:now(),status:'final'};tr.objectStore('drawRecords').put(draw);state.activeSeason.fixtureDrawId=drawId;state.activeSeason.status='group_stage';state.activeSeason.startedAt=state.activeSeason.startedAt||now();state.activeSeason.revision++;tr.objectStore('seasons').put(state.activeSeason);tr.objectStore('auditEntries').put({auditId:uid(),action:'draw_fixture',entityType:'season',entityId:state.activeSeason.seasonId,summary:'192 grup maçı oluşturuldu',createdAt:now()});await transactionDone(tr);await reloadState();renderAll();toast('32 grup için 192 maçlık fikstür oluşturuldu.','good')}catch(err){console.error(err);toast(err.message||'Fikstür oluşturulamadı.','bad',7000)}finally{setBusy(btn,false)}}
function validateAllocation(){const errors=[];const active=state.teams.filter(t=>t.status==='active');if(active.length!==128)errors.push('Tam olarak 128 aktif takım bulunmalıdır.');if(state.assignments.length!==128)errors.push('Tam olarak 128 takım ataması bulunmalıdır.');for(const l of LEAGUES)for(const g of GROUPS){const n=state.assignments.filter(a=>a.leagueCode===l&&a.groupNumber===g).length;if(n!==4)errors.push(`${l}${g} grubunda ${n} takım var.`)}if(new Set(state.assignments.map(a=>a.teamId)).size!==state.assignments.length)errors.push('Aynı takım birden fazla gruba atanmış.');return{ok:!errors.length,errors}}
function validateFixtureList(ms){const errors=[];if(ms.length!==192)errors.push(`192 yerine ${ms.length} maç üretildi.`);for(const l of LEAGUES)for(const g of GROUPS){const x=ms.filter(m=>m.leagueCode===l&&m.groupNumber===g);if(x.length!==6)errors.push(`${l}${g} için 6 maç yok.`);const pairs=new Set();const count=new Map();for(const m of x){const key=[m.sideATeamId,m.sideBTeamId].sort().join('|');if(pairs.has(key))errors.push(`${l}${g} grubunda tekrarlanan eşleşme.`);pairs.add(key);count.set(m.sideATeamId,(count.get(m.sideATeamId)||0)+1);count.set(m.sideBTeamId,(count.get(m.sideBTeamId)||0)+1)}for(const n of count.values())if(n!==3)errors.push(`${l}${g} grubunda bir takımın maç sayısı 3 değil.`);for(const r of [1,2,3]){const week=x.filter(m=>m.roundNumber===r);const ids=week.flatMap(m=>[m.sideATeamId,m.sideBTeamId]);if(week.length!==2||new Set(ids).size!==4)errors.push(`${l}${g} ${r}. hafta çakışmalı.`)}}return{ok:!errors.length,errors}}

async function requestAdminAccess(afterUnlock=null){if(afterUnlock)state.pendingAdminAction=afterUnlock;if(state.settings.adminPinHash){openPinModal('unlock')}else openPinModal('setup')}
function openPinModal(mode){$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal small-modal"><div class="modal-head"><h3>${mode==='setup'?'Admin PIN Oluştur':'Admin Kilidini Aç'}</h3><button class="btn ghost" id="close-pin">×</button></div><form id="pin-form"><div class="modal-body"><div class="field"><label>${mode==='setup'?'Yeni PIN (en az 4 hane)':'PIN'}</label><input id="pin-input" type="password" inputmode="numeric" minlength="4" required autofocus></div>${mode==='setup'?'<div class="alert warn small">Bu PIN gerçek sunucu güvenliği sağlamaz ve unutulursa kurtarılamaz. Yalnızca yerel düzenleme kilididir.</div>':''}</div><div class="modal-foot"><button class="btn" type="button" id="cancel-pin">İptal</button><button class="btn primary" type="submit">${mode==='setup'?'PIN’i Kaydet':'Kilidi Aç'}</button></div></form></div></div>`;$('#close-pin').onclick=$('#cancel-pin').onclick=closeModal;$('#pin-form').onsubmit=async e=>{e.preventDefault();const pin=$('#pin-input').value;if(pin.length<4)return toast('PIN en az 4 karakter olmalıdır.','bad');if(mode==='setup'){const salt=uid();state.settings.adminPinSalt=salt;state.settings.adminPinHash=await hashPin(pin,salt);state.settings.updatedAt=now();await dbPut('settings',state.settings);state.adminUnlocked=true;closeModal();updateHeader();const action=state.pendingAdminAction;state.pendingAdminAction=null;if(action)action();else switchView('admin');toast('Admin PIN oluşturuldu.','good')}else{const h=await hashPin(pin,state.settings.adminPinSalt);if(h!==state.settings.adminPinHash)return toast('PIN yanlış.','bad');state.adminUnlocked=true;closeModal();updateHeader();const action=state.pendingAdminAction;state.pendingAdminAction=null;if(action)action();else switchView('admin')}}}
async function hashPin(pin,salt){const data=new TextEncoder().encode(`${salt}:${pin}`);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lockAdmin(silent=false){state.adminUnlocked=false;updateHeader();if(state.activeView==='admin')renderAdmin();if(!silent)toast('Admin paneli kilitlendi.','info')}
function closeModal(){const m=$('#modal-root');m.innerHTML=''}

async function openMatchEditor(matchId){if(!state.adminUnlocked){state.pendingMatchId=matchId;requestAdminAccess(()=>{const id=state.pendingMatchId;state.pendingMatchId=null;openMatchEditor(id)});return}const m=matchById(matchId);if(!m)return toast('Maç bulunamadı.','bad');const goals=state.goalEvents.filter(e=>e.matchId===matchId),cards=state.cardEvents.filter(e=>e.matchId===matchId),injuries=state.injuryEvents.filter(e=>e.matchId===matchId);$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h3>Maçı Düzenle</h3><div class="small muted">${STAGES[m.stage]} · ${m.stage==='playout'?m.boundaryCode:(m.leagueCode||'')+(m.groupNumber||'')} · ${m.roundNumber||''}</div></div><button class="btn ghost" id="close-match">×</button></div><div class="modal-body"><div class="scoreboard"><div class="score-team">${logoHtml(teamById(m.sideATeamId),'lg')}<strong>${escapeHtml(teamName(m.sideATeamId))}</strong></div><div class="score-inputs"><input id="score-a" type="number" min="0" value="${m.scoreA??0}"><span>—</span><input id="score-b" type="number" min="0" value="${m.scoreB??0}"></div><div class="score-team">${logoHtml(teamById(m.sideBTeamId),'lg')}<strong>${escapeHtml(teamName(m.sideBTeamId))}</strong></div></div><div id="penalty-fields" class="inline-fields ${['qf','sf','final','playout'].includes(m.stage)?'':'hidden'}"><div class="field"><label>Takım A penaltı skoru</label><input id="pen-a" type="number" min="0" value="${m.penaltyScoreA??''}"></div><div class="field"><label>Takım B penaltı skoru</label><input id="pen-b" type="number" min="0" value="${m.penaltyScoreB??''}"></div></div><div class="section-head"><h4>Goller ve asistler</h4><button class="btn small-btn" id="add-goal">+ Gol ekle</button></div><div class="event-list" id="goal-list">${goals.map(e=>goalRowHtml(m,e)).join('')}</div><div class="section-head"><h4>Kartlar</h4><button class="btn small-btn" id="add-card">+ Kart ekle</button></div><div class="event-list" id="card-list">${cards.map(e=>cardRowHtml(m,e)).join('')}</div><div class="section-head"><h4>Sakatlıklar</h4><button class="btn small-btn" id="add-injury">+ Sakatlık ekle</button></div><div class="event-list" id="injury-list">${injuries.map(e=>injuryRowHtml(m,e)).join('')}</div><div class="divider"></div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="allow-incomplete" ${m.statisticsComplete===false&&m.status==='final'?'checked':''}> Oyuncu olayları skorla tam eşleşmese de “istatistik detayı eksik” olarak kesinleştirmeye izin ver.</label><div id="match-validation"></div></div><div class="modal-foot"><button class="btn" id="cancel-match">İptal</button><button class="btn" id="save-draft">Taslak Kaydet</button><button class="btn primary" id="finalize-match">Kesinleştir</button></div></div></div>`;
$('#close-match').onclick=$('#cancel-match').onclick=closeModal;$('#add-goal').onclick=()=>$('#goal-list').insertAdjacentHTML('beforeend',goalRowHtml(m));$('#add-card').onclick=()=>$('#card-list').insertAdjacentHTML('beforeend',cardRowHtml(m));$('#add-injury').onclick=()=>$('#injury-list').insertAdjacentHTML('beforeend',injuryRowHtml(m));$('#modal-root').onclick=e=>{if(e.target.matches('.remove-event'))e.target.closest('.event-row').remove()};$('#save-draft').onclick=()=>saveMatchFromModal(m,'draft');$('#finalize-match').onclick=()=>saveMatchFromModal(m,'final')}
function teamOptions(m,selected){return [m.sideATeamId,m.sideBTeamId].map(id=>`<option value="${id}" ${selected===id?'selected':''}>${escapeHtml(teamName(id))}</option>`).join('')}
function goalRowHtml(m,e={}){return `<div class="event-row" data-id="${e.eventId||''}"><select class="ev-team">${teamOptions(m,e.creditedTeamId||m.sideATeamId)}</select><input class="ev-player" list="player-datalist" placeholder="Golü atan oyuncu" value="${escapeHtml(e.scorerNameSnapshot||'')}"><input class="ev-minute" placeholder="45+2" value="${escapeHtml(minuteText(e,true))}"><select class="ev-goal-type"><option value="normal" ${e.goalType==='normal'?'selected':''}>Normal</option><option value="penalty" ${e.goalType==='penalty'?'selected':''}>Maç içi penaltı</option><option value="ownGoal" ${e.goalType==='ownGoal'?'selected':''}>Kendi kalesine</option><option value="unknown" ${e.goalType==='unknown'?'selected':''}>Oyuncusu bilinmiyor</option></select><input class="ev-assist" list="player-datalist" placeholder="Asist (isteğe bağlı)" value="${escapeHtml(e.assistNameSnapshot||'')}"><button class="btn danger small-btn remove-event" type="button">Sil</button></div>`}
function cardRowHtml(m,e={}){return `<div class="event-row card-row" data-id="${e.eventId||''}"><select class="ev-team">${teamOptions(m,e.teamId||m.sideATeamId)}</select><input class="ev-player" list="player-datalist" placeholder="Oyuncu" value="${escapeHtml(e.playerNameSnapshot||'')}"><select class="ev-card-type"><option value="yellow" ${e.cardType==='yellow'?'selected':''}>Sarı kart</option><option value="secondYellowRed" ${e.cardType==='secondYellowRed'?'selected':''}>Çift sarıdan kırmızı</option><option value="directRed" ${e.cardType==='directRed'?'selected':''}>Direkt kırmızı</option></select><input class="ev-minute" placeholder="Dakika" value="${escapeHtml(minuteText(e,true))}"><button class="btn danger small-btn remove-event" type="button">Sil</button></div>`}
function injuryRowHtml(m,e={}){return `<div class="event-row injury-row" data-id="${e.eventId||''}"><select class="ev-team">${teamOptions(m,e.teamId||m.sideATeamId)}</select><input class="ev-player" list="player-datalist" placeholder="Oyuncu" value="${escapeHtml(e.playerNameSnapshot||'')}"><input class="ev-minute" placeholder="Dakika" value="${escapeHtml(minuteText(e,true))}"><input class="ev-notes" placeholder="Sakatlık notu" value="${escapeHtml(e.notes||'')}"><button class="btn danger small-btn remove-event" type="button">Sil</button></div>`}
function parseMinute(v){const s=String(v||'').trim();if(!s)return{minute:null,stoppageMinute:null};const m=s.match(/^(\d{1,3})(?:\+(\d{1,2}))?$/);if(!m)return null;const minute=Number(m[1]),stop=m[2]?Number(m[2]):null;if(minute<1||minute>90)return null;return{minute,stoppageMinute:stop}}
function minuteText(e,empty=false){if(e?.minute==null)return empty?'':'—';return `${e.minute}${e.stoppageMinute?`+${e.stoppageMinute}`:''}`}
async function getOrCreatePlayer(name,teamId){const canonical=String(name||'').trim().replace(/\s+/g,' ');if(!canonical)return null;const normalized=normalizeName(canonical);let p=state.players.find(x=>x.status!=='merged'&&x.normalizedName===normalized);if(p){p.lastSeenAt=now();p.teamsSeen=[...new Set([...(p.teamsSeen||[]),teamId])];await dbPut('players',p);return p}p={playerId:uid(),canonicalName:canonical,normalizedName:normalized,aliases:[],teamsSeen:[teamId],firstSeenAt:now(),lastSeenAt:now(),status:'active',mergedIntoPlayerId:null,createdAt:now(),updatedAt:now()};await dbPut('players',p);state.players.push(p);return p}
async function saveMatchFromModal(m,targetStatus){const btn=targetStatus==='final'?$('#finalize-match'):$('#save-draft');setBusy(btn,true);try{const scoreA=Number($('#score-a').value),scoreB=Number($('#score-b').value);if(!Number.isInteger(scoreA)||scoreA<0||!Number.isInteger(scoreB)||scoreB<0)throw new Error('Skorlar sıfır veya pozitif tam sayı olmalıdır.');let penA=null,penB=null;if(['qf','sf','final','playout'].includes(m.stage)){const pa=$('#pen-a').value,pb=$('#pen-b').value;if(scoreA===scoreB){if(targetStatus==='final'&&(pa===''||pb===''))throw new Error('Berabere eleme maçında penaltı skoru zorunludur.');if(pa!==''||pb!==''){penA=Number(pa);penB=Number(pb);if(!Number.isInteger(penA)||!Number.isInteger(penB)||penA<0||penB<0||penA===penB)throw new Error('Penaltı skoru geçerli ve eşit olmayan tam sayılar olmalıdır.')}}else if(pa!==''||pb!=='')throw new Error('Normal skor eşit değilse penaltı skoru girilemez.')}const goalRows=$$('#goal-list .event-row'),cardRows=$$('#card-list .event-row'),injRows=$$('#injury-list .event-row');const goals=[],cards=[],injuries=[];for(const row of goalRows){const teamId=$('.ev-team',row).value,type=$('.ev-goal-type',row).value,playerName=$('.ev-player',row).value.trim(),assistName=$('.ev-assist',row).value.trim(),minute=parseMinute($('.ev-minute',row).value);if(!minute)throw new Error('Gol dakikası 1–90 veya 45+2 biçiminde olmalıdır.');if(!playerName&&type!=='unknown')throw new Error('Gol oyuncusu girilmeli veya “oyuncusu bilinmiyor” seçilmelidir.');const scorerTeamId=type==='ownGoal'?(teamId===m.sideATeamId?m.sideBTeamId:m.sideATeamId):teamId;const scorer=type==='unknown'?null:await getOrCreatePlayer(playerName,scorerTeamId);const assist=assistName?await getOrCreatePlayer(assistName,teamId):null;if(type==='ownGoal'&&assist)throw new Error('Kendi kalesine gole asist eklenemez.');goals.push({eventId:row.dataset.id||uid(),matchId:m.matchId,seasonId:m.seasonId,eventType:'goal',creditedTeamId:teamId,scorerPlayerId:scorer?.playerId||null,scorerNameSnapshot:scorer?.canonicalName||'',assistPlayerId:assist?.playerId||null,assistNameSnapshot:assist?.canonicalName||'',goalType:type,...minute,createdAt:now()})}for(const row of cardRows){const teamId=$('.ev-team',row).value,playerName=$('.ev-player',row).value.trim(),minute=parseMinute($('.ev-minute',row).value);if(!playerName)throw new Error('Kart gören oyuncu adı zorunludur.');if(!minute)throw new Error('Kart dakikası geçersiz.');const p=await getOrCreatePlayer(playerName,teamId);cards.push({eventId:row.dataset.id||uid(),matchId:m.matchId,seasonId:m.seasonId,teamId,playerId:p.playerId,playerNameSnapshot:p.canonicalName,cardType:$('.ev-card-type',row).value,...minute,createdAt:now()})}for(const row of injRows){const teamId=$('.ev-team',row).value,playerName=$('.ev-player',row).value.trim(),minute=parseMinute($('.ev-minute',row).value);if(!playerName)throw new Error('Sakatlanan oyuncu adı zorunludur.');if(!minute)throw new Error('Sakatlık dakikası geçersiz.');const p=await getOrCreatePlayer(playerName,teamId);injuries.push({eventId:row.dataset.id||uid(),matchId:m.matchId,seasonId:m.seasonId,teamId,playerId:p.playerId,playerNameSnapshot:p.canonicalName,...minute,notes:$('.ev-notes',row).value.trim(),severity:'unknown',createdAt:now()})}const countA=goals.filter(e=>e.creditedTeamId===m.sideATeamId).length,countB=goals.filter(e=>e.creditedTeamId===m.sideBTeamId).length;const statsComplete=countA===scoreA&&countB===scoreB;if(targetStatus==='final'&&!statsComplete&&!$('#allow-incomplete').checked)throw new Error(`Gol olayları skorla uyuşmuyor: ${countA}-${countB} olay, ${scoreA}-${scoreB} skor.`);const before={...m};m.scoreA=scoreA;m.scoreB=scoreB;m.penaltyScoreA=penA;m.penaltyScoreB=penB;m.status=targetStatus;m.statisticsComplete=statsComplete;m.finalizedAt=targetStatus==='final'?now():null;m.winnerTeamId=targetStatus==='final'?determineWinner(m):null;m.revision=(m.revision||0)+1;const tr=tx(['matches','goalEvents','cardEvents','injuryEvents','auditEntries'],'readwrite');tr.objectStore('matches').put(m);state.goalEvents.filter(e=>e.matchId===m.matchId).forEach(e=>tr.objectStore('goalEvents').delete(e.eventId));state.cardEvents.filter(e=>e.matchId===m.matchId).forEach(e=>tr.objectStore('cardEvents').delete(e.eventId));state.injuryEvents.filter(e=>e.matchId===m.matchId).forEach(e=>tr.objectStore('injuryEvents').delete(e.eventId));for(const e of goals)tr.objectStore('goalEvents').put(e);for(const e of cards)tr.objectStore('cardEvents').put(e);for(const e of injuries)tr.objectStore('injuryEvents').put(e);tr.objectStore('auditEntries').put({auditId:uid(),action:targetStatus==='final'?'finalize_match':'save_draft',entityType:'match',entityId:m.matchId,summary:`${teamName(m.sideATeamId)} - ${teamName(m.sideBTeamId)} ${targetStatus==='final'?'kesinleşti':'taslak kaydedildi'}`,before,after:m,createdAt:now()});await transactionDone(tr);if(targetStatus==='final')await handleProgressionAfterMatch(m);await reloadState();closeModal();renderAll();toast(targetStatus==='final'?'Maç kesinleşti.':'Taslak kaydedildi.','good')}catch(err){console.error(err);toast(err.message||'Maç kaydedilemedi.','bad',7000)}finally{setBusy(btn,false)}}
function determineWinner(m){if(m.scoreA>m.scoreB)return m.sideATeamId;if(m.scoreB>m.scoreA)return m.sideBTeamId;if(m.penaltyScoreA>m.penaltyScoreB)return m.sideATeamId;if(m.penaltyScoreB>m.penaltyScoreA)return m.sideBTeamId;return null}
async function handleProgressionAfterMatch(m){if(m.stage==='group'){const done=state.matches.filter(x=>x.stage==='group'&&x.status==='final').length;if(done===192){state.activeSeason.status='group_stage_locked';await dbPut('seasons',state.activeSeason)}}if(m.stage==='qf'||m.stage==='sf'){await ensureNextBracketMatches()}if(m.stage==='final'){state.activeSeason.championTeamId=m.winnerTeamId;state.activeSeason.status='final_eights_completed';await dbPut('seasons',state.activeSeason);celebrate()}await maybeReadyForTransition()}
async function ensureNextBracketMatches(){const matches=await dbGetAll('matches');const seasonMatches=matches.filter(x=>x.seasonId===state.activeSeason.seasonId);const qf=seasonMatches.filter(x=>x.stage==='qf').sort((a,b)=>a.displayOrder-b.displayOrder);const existingSf=seasonMatches.filter(x=>x.stage==='sf');if(qf.length===4&&qf.every(x=>x.status==='final')&&!existingSf.length){const sf=[makeBracketMatch('sf','SF1',qf[0].winnerTeamId,qf[1].winnerTeamId,1),makeBracketMatch('sf','SF2',qf[2].winnerTeamId,qf[3].winnerTeamId,2)];for(const x of sf)await dbPut('matches',x);return}const sf=seasonMatches.filter(x=>x.stage==='sf').sort((a,b)=>a.displayOrder-b.displayOrder);const existingFinal=seasonMatches.find(x=>x.stage==='final');if(sf.length===2&&sf.every(x=>x.status==='final')&&!existingFinal)await dbPut('matches',makeBracketMatch('final','Final',sf[0].winnerTeamId,sf[1].winnerTeamId,1))}
function makeBracketMatch(stage,slot,a,b,order){return{matchId:uid(),seasonId:state.activeSeason.seasonId,stage,leagueCode:'A',groupNumber:null,boundaryCode:null,roundNumber:stage==='sf'?2:3,bracketSlot:slot,displayOrder:order,sideATeamId:a,sideBTeamId:b,status:'scheduled',scoreA:null,scoreB:null,penaltyScoreA:null,penaltyScoreB:null,winnerTeamId:null,statisticsComplete:false,finalizedAt:null,drawRecordId:state.activeSeason.finalEightsDrawId,revision:1}}
async function maybeReadyForTransition(){const matches=await dbGetAll('matches');const sm=matches.filter(m=>m.seasonId===state.activeSeason.seasonId);if(sm.some(m=>m.stage==='final'&&m.status==='final')&&sm.filter(m=>m.stage==='playout'&&m.status==='final').length===28){state.activeSeason.status='ready_for_new_season';await dbPut('seasons',state.activeSeason)}}
function celebrate(){if(state.settings.reducedMotion||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const root=$('#confetti-root');root.innerHTML='<div class="confetti">'+Array.from({length:65},()=>`<i style="left:${Math.random()*100}%;animation-delay:${Math.random()*.8}s;transform:rotate(${Math.random()*180}deg);background:hsl(${Math.random()*360} 75% 60%)"></i>`).join('')+'</div>';setTimeout(()=>root.innerHTML='',3900)}

async function drawFinalEights(){try{const participants=[];for(const g of GROUPS){const rows=await standingsForGroup('A',g);if(rows.length<2)throw new Error(`A${g} grubu tamamlanmamış.`);participants.push({teamId:rows[0].teamId,group:g,pos:1},{teamId:rows[1].teamId,group:g,pos:2})}const winners=shuffle(participants.filter(x=>x.pos===1)),runners=shuffle(participants.filter(x=>x.pos===2));const pairings=findValidPairings(winners,runners);if(!pairings)throw new Error('Geçerli Final Eights eşleşmesi üretilemedi.');const drawId=uid(),seed=randomSeed(),matches=pairings.map((p,i)=>({matchId:uid(),seasonId:state.activeSeason.seasonId,stage:'qf',leagueCode:'A',groupNumber:null,boundaryCode:null,roundNumber:1,bracketSlot:`QF${i+1}`,displayOrder:i+1,sideATeamId:p[0].teamId,sideBTeamId:p[1].teamId,status:'scheduled',scoreA:null,scoreB:null,penaltyScoreA:null,penaltyScoreB:null,winnerTeamId:null,statisticsComplete:false,finalizedAt:null,drawRecordId:drawId,revision:1}));const tr=tx(['matches','drawRecords','seasons','auditEntries'],'readwrite');matches.forEach(m=>tr.objectStore('matches').put(m));tr.objectStore('drawRecords').put({drawId,seasonId:state.activeSeason.seasonId,drawType:'final_eights',participants:participants.map(x=>x.teamId),pots:{winners:winners.map(x=>x.teamId),runners:runners.map(x=>x.teamId)},constraints:['Birinci-ikinci eşleşmesi','Aynı grup eşleşemez'],randomSeed:seed,algorithmVersion:'restricted-draw-1.0',result:matches.map(m=>({a:m.sideATeamId,b:m.sideBTeamId})),createdAt:now(),lockedAt:now(),status:'final'});state.activeSeason.finalEightsDrawId=drawId;state.activeSeason.status='final_eights';tr.objectStore('seasons').put(state.activeSeason);tr.objectStore('auditEntries').put({auditId:uid(),action:'draw_final_eights',entityType:'season',entityId:state.activeSeason.seasonId,summary:'Final Eights çeyrek final kurası çekildi',createdAt:now()});await transactionDone(tr);await reloadState();renderAll();toast('Final Eights çeyrek final kurası çekildi.','good')}catch(err){toast(err.message,'bad')}}
function findValidPairings(winners,runners){const tryPerm=(arr,i=0)=>{if(i===arr.length){return winners.every((w,k)=>w.group!==arr[k].group)?winners.map((w,k)=>[w,arr[k]]):null}for(let j=i;j<arr.length;j++){[arr[i],arr[j]]=[arr[j],arr[i]];const ok=winners[i].group!==arr[i].group;const result=ok?tryPerm(arr,i+1):null;if(result)return result;[arr[i],arr[j]]=[arr[j],arr[i]]}return null};return tryPerm([...runners])}

async function drawPlayouts(){try{const drawId=uid(),all=[];for(let i=0;i<LEAGUES.length-1;i++){const upper=LEAGUES[i],lower=LEAGUES[i+1],upperTeams=[],lowerTeams=[];for(const g of GROUPS){const ur=await standingsForGroup(upper,g),lr=await standingsForGroup(lower,g);upperTeams.push(ur[2]?.teamId);lowerTeams.push(lr[1]?.teamId)}if(upperTeams.some(x=>!x)||lowerTeams.some(x=>!x))throw new Error(`${upper}-${lower} katılımcıları belirlenemedi.`);const us=shuffle(upperTeams),ls=shuffle(lowerTeams);for(let j=0;j<4;j++)all.push({matchId:uid(),seasonId:state.activeSeason.seasonId,stage:'playout',leagueCode:upper,groupNumber:null,boundaryCode:`${upper}-${lower}`,roundNumber:1,bracketSlot:null,displayOrder:j+1,sideATeamId:us[j],sideBTeamId:ls[j],status:'scheduled',scoreA:null,scoreB:null,penaltyScoreA:null,penaltyScoreB:null,winnerTeamId:null,statisticsComplete:false,finalizedAt:null,drawRecordId:drawId,revision:1})}const tr=tx(['matches','drawRecords','seasons','auditEntries'],'readwrite');all.forEach(m=>tr.objectStore('matches').put(m));tr.objectStore('drawRecords').put({drawId,seasonId:state.activeSeason.seasonId,drawType:'playouts',participants:all.flatMap(m=>[m.sideATeamId,m.sideBTeamId]),pots:null,constraints:['Her sınırda dört üst lig üçüncüsü ve dört alt lig ikincisi'],randomSeed:randomSeed(),algorithmVersion:'playout-random-1.0',result:all.map(m=>({boundary:m.boundaryCode,a:m.sideATeamId,b:m.sideBTeamId})),createdAt:now(),lockedAt:now(),status:'final'});state.activeSeason.status='playouts';tr.objectStore('seasons').put(state.activeSeason);tr.objectStore('auditEntries').put({auditId:uid(),action:'draw_playouts',entityType:'season',entityId:state.activeSeason.seasonId,summary:'28 play-out maçı oluşturuldu',createdAt:now()});await transactionDone(tr);await reloadState();renderAll();toast('Yedi lig sınırı için 28 play-out maçı oluşturuldu.','good')}catch(err){toast(err.message,'bad')}}

async function openSeasonTransition(){const memberships=await computeNextMemberships();const errors=LEAGUES.filter(l=>(memberships[l]||[]).length!==16).map(l=>`${l} Ligi: ${(memberships[l]||[]).length} takım`);$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h3>Yeni Sezon Geçişi</h3><button class="btn ghost" id="close-transition">×</button></div><div class="modal-body">${errors.length?`<div class="alert bad"><strong>Lig sayıları doğrulanamadı</strong><div>${errors.join('<br>')}</div></div>`:'<div class="alert good">Her yeni ligde tam olarak 16 takım bulunuyor.</div>'}<div class="wizard-grid">${LEAGUES.map(l=>`<div class="card"><h3>${l} Ligi · ${memberships[l].length}/16</h3><div class="movement-list">${memberships[l].map(x=>`<div class="movement"><span>${escapeHtml(teamName(x.teamId))}</span><span class="small muted">${escapeHtml(x.sourceLabel)}</span></div>`).join('')}</div></div>`).join('')}</div><div class="alert warn"><strong>Yeni sezon grup kurası</strong><div>Her ligde takımlar kaynak statülerine göre dört torbaya ayrılacak ve her gruba her torbadan bir takım yerleştirilecektir. Sonuçlar daha sonra manuel düzeltilebilir.</div></div></div><div class="modal-foot"><button class="btn" id="cancel-transition">İptal</button><button class="btn good" id="confirm-transition" ${errors.length?'disabled':''}>Yeni Sezonu Oluştur</button></div></div></div>`;$('#close-transition').onclick=$('#cancel-transition').onclick=closeModal;$('#confirm-transition').onclick=()=>createNextSeason(memberships)}
async function computeNextMemberships(){const ranks={};for(const l of LEAGUES){ranks[l]={};for(const g of GROUPS)ranks[l][g]=await standingsForGroup(l,g)}const out=Object.fromEntries(LEAGUES.map(l=>[l,[]]));const add=(league,teamId,source,sourceLabel)=>out[league].push({teamId,source,sourceLabel});const pl=state.matches.filter(m=>m.stage==='playout'&&m.status==='final');const landedAt=(boundary,targetLeague)=>pl.filter(m=>m.boundaryCode===boundary).map(m=>{const [upper]=boundary.split('-');return targetLeague===upper?m.winnerTeamId:(m.winnerTeamId===m.sideATeamId?m.sideBTeamId:m.sideATeamId)});
// A Ligi: grup birincileri, grup ikincileri, A-B play-out kazananları, B grup birincileri.
for(const g of GROUPS){add('A',ranks.A[g][0].teamId,'pot1','A grup birincisi');add('A',ranks.A[g][1].teamId,'pot2','A grup ikincisi');add('A',ranks.B[g][0].teamId,'pot4','B’den doğrudan yükseldi')}for(const id of landedAt('A-B','A'))add('A',id,'pot3','A-B play-out ile A Ligi hakkı');
// B–G: üst ligden doğrudan düşenler, üst sınır play-out ile gelenler, alt ligden doğrudan yükselenler, alt sınır play-out ile gelenler.
for(let i=1;i<LEAGUES.length-1;i++){const target=LEAGUES[i],upper=LEAGUES[i-1],lower=LEAGUES[i+1];for(const g of GROUPS){add(target,ranks[upper][g][3].teamId,'pot1',`${upper}’den doğrudan düştü`);add(target,ranks[lower][g][0].teamId,'pot3',`${lower}’den doğrudan yükseldi`)}for(const id of landedAt(`${upper}-${target}`,target))add(target,id,'pot2',`${upper}-${target} play-out ile ${target} hakkı`);for(const id of landedAt(`${target}-${lower}`,target))add(target,id,'pot4',`${target}-${lower} play-out ile ${target} hakkı`)}
// H Ligi: H üçüncüleri, H dördüncüleri, G’den doğrudan düşenler, G-H play-out ile H’de kalan/düşenler.
for(const g of GROUPS){add('H',ranks.H[g][2].teamId,'pot1','H grup üçüncüsü');add('H',ranks.H[g][3].teamId,'pot2','H grup dördüncüsü');add('H',ranks.G[g][3].teamId,'pot3','G’den doğrudan düştü')}for(const id of landedAt('G-H','H'))add('H',id,'pot4','G-H play-out ile H Ligi hakkı');
for(const l of LEAGUES){const seen=new Set();out[l]=out[l].filter(x=>!seen.has(x.teamId)&&(seen.add(x.teamId),true))}return out}
function permutations(arr){if(arr.length<=1)return[arr];const out=[];for(let i=0;i<arr.length;i++){const rest=[...arr.slice(0,i),...arr.slice(i+1)];for(const p of permutations(rest))out.push([arr[i],...p])}return out}
function allocatePotsToGroups(pots){const groups=[[],[],[],[]];const oldMap=new Map(state.assignments.map(a=>[a.teamId,`${a.leagueCode}${a.groupNumber}`]));const first=shuffle(pots[0]);first.forEach((item,i)=>groups[i].push(item));for(let p=1;p<4;p++){let best=null,bestScore=Infinity;for(const perm of permutations(shuffle(pots[p]))){let score=0;for(let g=0;g<4;g++){const old=oldMap.get(perm[g].teamId);if(old)score+=groups[g].filter(x=>oldMap.get(x.teamId)===old).length}if(score<bestScore){bestScore=score;best=perm;if(score===0)break}}best.forEach((item,g)=>groups[g].push(item))}return groups}
async function createNextSeason(memberships){const btn=$('#confirm-transition');setBusy(btn,true);try{const allSeasons=await dbGetAll('seasons'),nextNum=Math.max(...allSeasons.map(s=>s.seasonNumber))+1;const newSeason={seasonId:uid(),seasonNumber:nextNum,name:`Sezon ${nextNum}`,ruleVersion:'1.0',status:'ready_for_fixture',createdAt:now(),startedAt:null,completedAt:null,championTeamId:null,fixtureDrawId:null,finalEightsDrawId:null,transitionId:null,revision:1};const assignments=[];const drawId=uid(),drawResult={};for(const l of LEAGUES){const members=memberships[l];if(members.length!==16)throw new Error(`${l} Ligi 16 takım içermiyor.`);const pots=['pot1','pot2','pot3','pot4'].map(key=>shuffle(members.filter(m=>m.source===key)));if(pots.some(p=>p.length!==4))throw new Error(`${l} Ligi torbaları 4×4 biçiminde oluşturulamadı.`);drawResult[l]=pots.map(p=>p.map(x=>x.teamId));const allocatedGroups=allocatePotsToGroups(pots);for(let g=1;g<=4;g++){for(let p=0;p<4;p++){const item=allocatedGroups[g-1][p];assignments.push({assignmentId:uid(),seasonId:newSeason.seasonId,teamId:item.teamId,leagueCode:l,groupNumber:g,slotNumber:p+1,sourceType:'automatic_pot_draw',sourceDrawId:drawId,teamNameSnapshot:teamName(item.teamId),logoSnapshot:null,lotNumber:randomLot(),createdAt:now(),updatedAt:now()})}}}const transitionId=uid();newSeason.transitionId=transitionId;state.activeSeason.status='archived';state.activeSeason.completedAt=now();const tr=tx(['seasons','assignments','drawRecords','seasonTransitions','settings','auditEntries'],'readwrite');tr.objectStore('seasons').put(state.activeSeason);tr.objectStore('seasons').put(newSeason);assignments.forEach(a=>tr.objectStore('assignments').put(a));tr.objectStore('drawRecords').put({drawId,seasonId:newSeason.seasonId,drawType:'new_season_groups',participants:assignments.map(a=>a.teamId),pots:drawResult,constraints:['Her gruba her torbadan bir takım'],randomSeed:randomSeed(),algorithmVersion:'four-pot-1.0',result:assignments.map(a=>({teamId:a.teamId,league:a.leagueCode,group:a.groupNumber,slot:a.slotNumber})),createdAt:now(),lockedAt:now(),status:'final'});tr.objectStore('seasonTransitions').put({transitionId,fromSeasonId:state.activeSeason.seasonId,toSeasonId:newSeason.seasonId,directPromotions:[],directRelegations:[],playoutResults:state.matches.filter(m=>m.stage==='playout').map(m=>({matchId:m.matchId,winnerTeamId:m.winnerTeamId})),nextLeagueMemberships:memberships,allocationPots:drawResult,automaticAssignments:assignments.map(a=>a.assignmentId),manualAdjustments:[],status:'confirmed',createdAt:now(),confirmedAt:now()});state.settings.activeSeasonId=newSeason.seasonId;state.settings.updatedAt=now();tr.objectStore('settings').put(state.settings);tr.objectStore('auditEntries').put({auditId:uid(),action:'create_season',entityType:'season',entityId:newSeason.seasonId,summary:`${newSeason.name} oluşturuldu`,createdAt:now()});await transactionDone(tr);await reloadState();closeModal();renderAll();toast(`${newSeason.name} oluşturuldu. Gruplar otomatik dağıtıldı.`,'good',6000)}catch(err){console.error(err);toast(err.message,'bad',7000)}finally{setBusy(btn,false)}}

function openMergePlayers(){const active=state.players.filter(p=>p.status!=='merged').sort((a,b)=>a.canonicalName.localeCompare(b.canonicalName,'tr'));$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal small-modal"><div class="modal-head"><h3>Oyuncu Kayıtlarını Birleştir</h3><button class="btn ghost" id="close-merge">×</button></div><div class="modal-body"><div class="field"><label>Kanonik oyuncu</label><select id="merge-target"><option value="">Seçin</option>${active.map(p=>`<option value="${p.playerId}">${escapeHtml(p.canonicalName)}</option>`).join('')}</select></div><div class="field"><label>Birleştirilecek hatalı/alternatif kayıt</label><select id="merge-source"><option value="">Seçin</option>${active.map(p=>`<option value="${p.playerId}">${escapeHtml(p.canonicalName)}</option>`).join('')}</select></div><div class="alert warn small">Bütün geçmiş maç olayları kanonik oyuncuya yönlendirilir. İşlem öncesi geri dönüş noktası oluşturulur.</div></div><div class="modal-foot"><button class="btn" id="cancel-merge">İptal</button><button class="btn danger" id="confirm-merge">Birleştir</button></div></div></div>`;$('#close-merge').onclick=$('#cancel-merge').onclick=closeModal;$('#confirm-merge').onclick=mergePlayers}
async function mergePlayers(){const targetId=$('#merge-target').value,sourceId=$('#merge-source').value;if(!targetId||!sourceId||targetId===sourceId)return toast('İki farklı oyuncu seçilmelidir.','bad');const target=state.players.find(p=>p.playerId===targetId),source=state.players.find(p=>p.playerId===sourceId);if(!confirmAction(`${source.canonicalName}, ${target.canonicalName} kaydıyla birleştirilsin mi?`))return;await createRollbackSnapshot('player_merge');const tr=tx(['players','goalEvents','cardEvents','injuryEvents','auditEntries'],'readwrite');for(const storeName of ['goalEvents','cardEvents','injuryEvents']){const store=tr.objectStore(storeName);const index=store.index('playerId');const req=index.openCursor(IDBKeyRange.only(sourceId));req.onsuccess=e=>{const c=e.target.result;if(c){const v=c.value;if(storeName==='goalEvents')v.scorerPlayerId=targetId;else v.playerId=targetId;c.update(v);c.continue()}}}const assists=tr.objectStore('goalEvents').openCursor();assists.onsuccess=e=>{const c=e.target.result;if(c){const v=c.value;if(v.assistPlayerId===sourceId){v.assistPlayerId=targetId;c.update(v)}c.continue()}};target.aliases=[...new Set([...(target.aliases||[]),source.canonicalName,...(source.aliases||[])])];target.teamsSeen=[...new Set([...(target.teamsSeen||[]),...(source.teamsSeen||[])])];target.updatedAt=now();source.status='merged';source.mergedIntoPlayerId=targetId;source.updatedAt=now();tr.objectStore('players').put(target);tr.objectStore('players').put(source);tr.objectStore('auditEntries').put({auditId:uid(),action:'merge_players',entityType:'player',entityId:targetId,summary:`${source.canonicalName}, ${target.canonicalName} ile birleştirildi`,createdAt:now()});await transactionDone(tr);await reloadState();closeModal();renderAll();toast('Oyuncu kayıtları birleştirildi.','good')}
async function createRollbackSnapshot(reason){const data={};for(const s of ['players','goalEvents','cardEvents','injuryEvents','matches','assignments','seasons'])data[s]=await dbGetAll(s);await dbPut('rollbackSnapshots',{snapshotId:uid(),reason,createdAt:now(),data})}
async function runHealthCheck(){const errors=[];const teamIds=new Set(state.teams.map(t=>t.teamId)),playerIds=new Set(state.players.map(p=>p.playerId)),matchIds=new Set(state.matches.map(m=>m.matchId));for(const a of state.assignments)if(!teamIds.has(a.teamId))errors.push(`Atama ${a.assignmentId}: takım bulunamadı.`);for(const m of state.matches){if(!teamIds.has(m.sideATeamId)||!teamIds.has(m.sideBTeamId))errors.push(`Maç ${m.matchId}: takım referansı eksik.`);if(m.sideATeamId===m.sideBTeamId)errors.push(`Maç ${m.matchId}: aynı takım iki tarafta.`)}for(const e of [...state.goalEvents,...state.cardEvents,...state.injuryEvents])if(!matchIds.has(e.matchId))errors.push(`Olay ${e.eventId}: maç bulunamadı.`);for(const e of state.cardEvents)if(!playerIds.has(e.playerId))errors.push(`Kart ${e.eventId}: oyuncu bulunamadı.`);const allocation=validateAllocation();if(state.matches.some(m=>m.stage==='group')&&!allocation.ok)errors.push(...allocation.errors);$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal small-modal"><div class="modal-head"><h3>Veri Sağlık Raporu</h3><button class="btn ghost" id="close-health">×</button></div><div class="modal-body">${errors.length?`<div class="alert bad"><strong>${errors.length} sorun bulundu</strong><div class="small" style="margin-top:8px">${errors.map(escapeHtml).join('<br>')}</div></div>`:'<div class="alert good"><strong>Temel veri bütünlüğü kontrolleri başarılı.</strong></div>'}</div><div class="modal-foot"><button class="btn" id="ok-health">Kapat</button></div></div></div>`;$('#close-health').onclick=$('#ok-health').onclick=closeModal}

function renderSettings(){const s=state.settings;$('#view-settings').innerHTML=`<div class="page-head"><div><h2>Yedekleme ve Ayarlar</h2><p>Veriler yalnızca bu tarayıcının IndexedDB alanında saklanır.</p></div></div><div class="grid cols-2"><div class="card"><h3>JSON yedekleme</h3><p class="muted">Takımlar, logolar, oyuncular, sezonlar, maçlar, olaylar ve kuralar tek dosyada dışa aktarılır.</p><div class="form-actions" style="justify-content:flex-start"><button class="btn primary" id="export-settings">JSON Dışa Aktar</button><label class="btn">JSON İçe Aktar<input id="import-file" type="file" accept="application/json" hidden></label></div><div class="small muted" style="margin-top:10px">Son yedek: ${s.lastExportedAt?formatDate(s.lastExportedAt):'Henüz alınmadı'}</div></div><div class="card"><h3>Görünüm</h3><div class="field"><label>Tema</label><select id="theme-select"><option value="dark" ${s.theme==='dark'?'selected':''}>Koyu</option><option value="light" ${s.theme==='light'?'selected':''}>Açık</option></select></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="reduced-motion" type="checkbox" ${s.reducedMotion?'checked':''}> Animasyonları azalt</label></div><div class="card"><h3>Admin kilidi</h3><div class="field"><label>Otomatik kilit süresi</label><select id="lock-minutes"><option value="5" ${s.autoLockMinutes===5?'selected':''}>5 dakika</option><option value="15" ${s.autoLockMinutes===15?'selected':''}>15 dakika</option><option value="30" ${s.autoLockMinutes===30?'selected':''}>30 dakika</option><option value="60" ${s.autoLockMinutes===60?'selected':''}>60 dakika</option></select></div><button class="btn" id="change-pin" style="margin-top:10px">PIN’i değiştir</button></div><div class="card"><h3>Depolama uyarısı</h3><div class="alert warn small">Tarayıcı verileri temizlenirse kayıtlar silinebilir. Uygulama otomatik yedek hatırlatması göstermez; JSON yedeğini kullanıcı istediği zaman alır.</div><button class="btn" id="settings-health">Veri sağlığını kontrol et</button></div></div>`;$('#export-settings').onclick=exportData;$('#import-file').onchange=e=>importData(e.target.files[0]);$('#theme-select').onchange=async e=>{s.theme=e.target.value;s.updatedAt=now();await dbPut('settings',s);document.documentElement.dataset.theme=s.theme};$('#reduced-motion').onchange=async e=>{s.reducedMotion=e.target.checked;s.updatedAt=now();await dbPut('settings',s)};$('#lock-minutes').onchange=async e=>{s.autoLockMinutes=Number(e.target.value);s.updatedAt=now();await dbPut('settings',s)};$('#change-pin').onclick=()=>{if(state.adminUnlocked)openPinModal('setup');else requestAdminAccess(()=>openPinModal('setup'))};$('#settings-health').onclick=runHealthCheck}
async function blobToDataUrl(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
function dataUrlToBlob(dataUrl){const [head,data]=dataUrl.split(',');const mime=head.match(/data:(.*?);/)[1];const bin=atob(data);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function simpleHash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
async function exportData(){try{const payload={schemaVersion:SCHEMA_VERSION,appVersion:APP_VERSION,exportId:uid(),exportedAt:now(),databaseId:state.settings.databaseId,activeSeasonId:state.settings.activeSeasonId};for(const s of STORES){let items=await dbGetAll(s);if(s==='logoAssets'){items=await Promise.all(items.map(async a=>({...a,blobDataUrl:await blobToDataUrl(a.blob),blob:undefined})))}payload[s]=items}payload.integritySummary=Object.fromEntries(STORES.map(s=>[s,payload[s]?.length||0]));const copy=JSON.stringify(payload);payload.checksum=simpleHash(copy);const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`global-club-league-backup-${new Date().toISOString().replace(/[:T]/g,'-').slice(0,16)}.json`;a.click();URL.revokeObjectURL(url);state.settings.lastExportedAt=now();state.settings.updatedAt=now();await dbPut('settings',state.settings);renderDashboard();renderSettings();toast('JSON yedeği oluşturuldu.','good')}catch(err){console.error(err);toast('Yedek oluşturulamadı.','bad')}}
async function importData(file){if(!file)return;try{const text=await file.text(),data=JSON.parse(text);if(data.schemaVersion!==SCHEMA_VERSION)throw new Error(`Desteklenmeyen şema sürümü: ${data.schemaVersion}`);for(const s of STORES)if(!Array.isArray(data[s]))throw new Error(`${s} koleksiyonu eksik.`);if(!confirmAction('İçe aktarma mevcut veritabanının tamamını değiştirecek. Devam edilsin mi?'))return;const rollbackData={};for(const s of ['settings','teams','logoConfigs','logoAssets','players','seasons','assignments','matches','goalEvents','cardEvents','injuryEvents','drawRecords','seasonTransitions','auditEntries'])rollbackData[s]=await dbGetAll(s);const rollback={snapshotId:uid(),reason:'before_import',createdAt:now(),data:rollbackData};const tr=tx(STORES,'readwrite');for(const s of STORES)tr.objectStore(s).clear();for(const s of STORES){for(const raw of data[s]){const item={...raw};if(s==='logoAssets'&&item.blobDataUrl){item.blob=dataUrlToBlob(item.blobDataUrl);delete item.blobDataUrl}tr.objectStore(s).put(item)}}tr.objectStore('rollbackSnapshots').put(rollback);await transactionDone(tr);await reloadState();renderAll();toast('Yedek başarıyla geri yüklendi.','good',6000)}catch(err){console.error(err);toast(err.message||'JSON içe aktarılamadı.','bad',8000)}}

initialize();
</script>

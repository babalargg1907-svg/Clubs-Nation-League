function dbGet(store,key){return new Promise((res,rej)=>{const r=tx([store]).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function dbGetAll(store){return new Promise((res,rej)=>{const r=tx([store]).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function dbPut(store,value,transaction=null){return new Promise((res,rej)=>{const s=(transaction||tx([store],'readwrite')).objectStore(store);const r=s.put(value);r.onsuccess=()=>res(value);r.onerror=()=>rej(r.error)})}
function dbDelete(store,key){return new Promise((res,rej)=>{const r=tx([store],'readwrite').objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function dbClear(store,transaction=null){return new Promise((res,rej)=>{const s=(transaction||tx([store],'readwrite')).objectStore(store);const r=s.clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function transactionDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('İşlem iptal edildi'))})}

async function ensureDefaults(){

    settings={settingsId:'main',databaseId:uid(),activeSeasonId:null,theme:'dark',adminPinHash:null,adminPinSalt:null,autoLockMinutes:15,reducedMotion:false,lastExportedAt:null,dataSchemaVersion:SCHEMA_VERSION,createdAt:now(),updatedAt:now()};
    await dbPut('settings',settings);

  const seasons=await dbGetAll('seasons');

    const season={seasonId:uid(),seasonNumber:1,name:'Sezon 1',ruleVersion:'1.1',status:'team_allocation',createdAt:now(),startedAt:null,completedAt:null,championTeamId:null,runnerUpTeamId:null,thirdPlaceTeamId:null,fourthPlaceTeamId:null,finalPlacements:null,fixtureDrawId:null,finalEightsDrawId:null,transitionId:null,revision:1};

/* v0.2 veri göçü: Eski gol kayıtlarına oyuncunun olay anındaki takımını ekler,
   oyuncular için yalnızca güncel görünümde kullanılacak currentTeamId alanını üretir. */
async function migrateDatabase(force=false){
  const settings=await dbGet('settings','main');
  if(!settings)return;
  const current=Number(settings.dataSchemaVersion||1);
  if(current>=SCHEMA_VERSION&&!force)return;
  const [matches,goals,cards,injuries,players,seasons]=await Promise.all([
    dbGetAll('matches'),dbGetAll('goalEvents'),dbGetAll('cardEvents'),dbGetAll('injuryEvents'),dbGetAll('players'),dbGetAll('seasons')
  ]);
  const matchMap=new Map(matches.map(m=>[m.matchId,m]));
  const latestTeam=new Map();
  const noteTeam=(playerId,teamId,stamp)=>{if(!playerId||!teamId)return;const old=latestTeam.get(playerId);if(!old||String(stamp||'')>String(old.stamp||''))latestTeam.set(playerId,{teamId,stamp:stamp||''})};
  for(const m of matches){if(m.extraTimeScoreA===undefined)m.extraTimeScoreA=null;if(m.extraTimeScoreB===undefined)m.extraTimeScoreB=null;if(m.statisticsComplete===undefined)m.statisticsComplete=false}
  for(const e of goals){
    const m=matchMap.get(e.matchId);
    if(!e.scorerTeamId)e.scorerTeamId=e.goalType==='ownGoal'&&m?(e.creditedTeamId===m.sideATeamId?m.sideBTeamId:m.sideATeamId):e.creditedTeamId;
    if(e.assistPlayerId&&!e.assistTeamId)e.assistTeamId=e.creditedTeamId;
    noteTeam(e.scorerPlayerId,e.scorerTeamId,e.createdAt);noteTeam(e.assistPlayerId,e.assistTeamId,e.createdAt);
  }
  for(const e of cards)noteTeam(e.playerId,e.teamId,e.createdAt);
  for(const e of injuries)noteTeam(e.playerId,e.teamId,e.createdAt);
  for(const p of players){const last=latestTeam.get(p.playerId);if(!p.currentTeamId&&last)p.currentTeamId=last.teamId;p.teamsSeen=[...new Set((p.teamsSeen||[]).filter(Boolean))];p.updatedAt=p.updatedAt||now()}
  for(const season of seasons){
    const sm=matches.filter(m=>m.seasonId===season.seasonId),semis=sm.filter(m=>m.stage==='sf').sort((a,b)=>(a.displayOrder||0)-(b.displayOrder||0));let third=sm.find(m=>m.stage==='third');
    if(!third&&season.status!=='archived'&&semis.length===2&&semis.every(m=>m.status==='final')){third={matchId:uid(),seasonId:season.seasonId,stage:'third',leagueCode:'A',groupNumber:null,boundaryCode:null,roundNumber:3,bracketSlot:'Third',displayOrder:2,sideATeamId:loserTeamId(semis[0]),sideBTeamId:loserTeamId(semis[1]),status:'scheduled',scoreA:null,scoreB:null,extraTimeScoreA:null,extraTimeScoreB:null,penaltyScoreA:null,penaltyScoreB:null,winnerTeamId:null,statisticsComplete:false,finalizedAt:null,drawRecordId:season.finalEightsDrawId||null,revision:1};matches.push(third);if(['ready_for_new_season','final_eights_completed'].includes(season.status))season.status=sm.some(m=>m.stage==='playout')?'playouts':'final_eights'}
    const final=sm.find(m=>m.stage==='final'&&m.status==='final');
    if(final){season.championTeamId=final.winnerTeamId||season.championTeamId||null;season.runnerUpTeamId=final.winnerTeamId?(final.winnerTeamId===final.sideATeamId?final.sideBTeamId:final.sideATeamId):(season.runnerUpTeamId||null)}
    if(third?.status==='final'){season.thirdPlaceTeamId=third.winnerTeamId||season.thirdPlaceTeamId||null;season.fourthPlaceTeamId=third.winnerTeamId?(third.winnerTeamId===third.sideATeamId?third.sideBTeamId:third.sideATeamId):(season.fourthPlaceTeamId||null)}
    season.finalPlacements=season.finalPlacements||{first:season.championTeamId||null,second:season.runnerUpTeamId||null,third:season.thirdPlaceTeamId||null,fourth:season.fourthPlaceTeamId||null};season.ruleVersion=season.ruleVersion||'1.0';season.updatedAt=season.updatedAt||now();
  }
  const tr=tx(['goalEvents','players','seasons','matches','settings'],'readwrite');goals.forEach(e=>tr.objectStore('goalEvents').put(e));players.forEach(p=>tr.objectStore('players').put(p));seasons.forEach(s=>tr.objectStore('seasons').put(s));matches.forEach(m=>tr.objectStore('matches').put(m));settings.dataSchemaVersion=SCHEMA_VERSION;settings.updatedAt=now();tr.objectStore('settings').put(settings);await transactionDone(tr);
}
async function reloadState(){state.settings=await dbGet('settings','main');document.documentElement.dataset.theme=state.settings.theme||'dark';const allSeasons=await dbGetAll('seasons');state.activeSeason=allSeasons.find(s=>s.seasonId===state.settings.activeSeasonId)||allSeasons.sort((a,b)=>b.seasonNumber-a.seasonNumber)[0];if(state.activeSeason&&state.settings.activeSeasonId!==state.activeSeason.seasonId){state.settings.activeSeasonId=state.activeSeason.seasonId;await dbPut('settings',state.settings)}const seasonId=state.activeSeason?.seasonId;[state.teams,state.players,state.draws,state.bestElevens]=await Promise.all([dbGetAll('teams'),dbGetAll('players'),dbGetAll('drawRecords'),dbGetAll('seasonBestElevens')]);const [assignments,matches,goals,cards,injuries]=await Promise.all([dbGetAll('assignments'),dbGetAll('matches'),dbGetAll('goalEvents'),dbGetAll('cardEvents'),dbGetAll('injuryEvents')]);state.assignments=assignments.filter(x=>x.seasonId===seasonId);state.matches=matches.filter(x=>x.seasonId===seasonId);state.goalEvents=goals.filter(x=>x.seasonId===seasonId);state.cardEvents=cards.filter(x=>x.seasonId===seasonId);state.injuryEvents=injuries.filter(x=>x.seasonId===seasonId);await loadLogoUrls();updatePlayerDatalist()}
async function loadLogoUrls(){for(const url of state.logoUrls.values())URL.revokeObjectURL(url);state.logoUrls.clear();const assets=await dbGetAll('logoAssets');for(const a of assets){if(a.blob instanceof Blob)state.logoUrls.set(a.logoAssetId,URL.createObjectURL(a.blob))}}

  const teams=state.teams.filter(t=>t.status==='active'),assigned=state.assignments.length;
  const groupMatches=state.matches.filter(m=>m.stage==='group'),groupFinal=groupMatches.filter(m=>m.status==='final').length;

function metricCard(label,value,sub,ratio){return `<div class="card"><div class="metric"><div><div class="label">${label}</div><div class="value">${value}</div></div><div class="small muted">${sub}</div></div><div class="progress"><span style="width:${clamp(ratio*100,0,100)}%"></span></div></div>`}
function seasonSteps(){
  const teams=state.teams.filter(t=>t.status==='active').length,assigned=state.assignments.length,groupFinal=state.matches.filter(m=>m.stage==='group'&&m.status==='final').length;
  const finalDone=state.matches.some(m=>m.stage==='final'&&m.status==='final'),thirdDone=state.matches.some(m=>m.stage==='third'&&m.status==='final'),finalsDone=finalDone&&thirdDone;
  const plDone=state.matches.filter(m=>m.stage==='playout'&&m.status==='final').length===28;
  return[{title:'1. Takımlar',detail:`${teams}/128`,state:teams===128?'done':teams?'active':''},{title:'2. Yerleşim',detail:`${assigned}/128`,state:assigned===128?'done':teams===128?'active':''},{title:'3. Fikstür',detail:state.matches.some(m=>m.stage==='group')?'Çekildi':'Bekliyor',state:state.matches.some(m=>m.stage==='group')?'done':assigned===128?'active':''},{title:'4. Gruplar',detail:`${groupFinal}/192`,state:groupFinal===192?'done':state.matches.some(m=>m.stage==='group')?'active':''},{title:'5. Final Eights',detail:finalsDone?'Tamamlandı':state.matches.some(m=>m.stage==='qf')?'Devam ediyor':'Bekliyor',state:finalsDone?'done':groupFinal===192?'active':''},{title:'6. Play-out',detail:plDone?'Tamamlandı':`${state.matches.filter(m=>m.stage==='playout'&&m.status==='final').length}/28`,state:plDone?'done':groupFinal===192?'active':''},{title:'7. Yeni Sezon',detail:state.activeSeason.status==='ready_for_new_season'?'Hazır':'Bekliyor',state:state.activeSeason.status==='ready_for_new_season'?'active':''}];
}
function nextRequiredAction(){
  const teams=state.teams.filter(t=>t.status==='active').length;
  if(teams<128)return{label:'Takım ekle',title:'Takım havuzunu tamamlayın',detail:`Fikstürden önce ${128-teams} takım daha oluşturulmalıdır.`,view:'admin'};
  if(state.assignments.length<128)return{label:'Yerleşimi tamamla',title:'Takımları lig ve gruplara yerleştirin',detail:`${128-state.assignments.length} takım henüz bir gruba atanmamış.`,view:'admin'};
  if(!state.matches.some(m=>m.stage==='group'))return{label:'Fikstürü çek',title:'Grup fikstürünü oluşturun',detail:'32 grup için 192 geçerli maç oluşturulacak.',view:'admin'};
  const gf=state.matches.filter(m=>m.stage==='group'&&m.status==='final').length;
  if(gf<192)return{label:'Maç sonuçlarına git',title:'Grup maçlarını sıralı akışta tamamlayın',detail:`${currentFixtureFlowDescription()} ${192-gf} grup maçı sonuç bekliyor.`,view:'fixtures'};
  if(!state.matches.some(m=>m.stage==='qf'))return{label:'Kuraları aç',title:'Final Eights ve play-out kuralarını çekin',detail:'Grup sıralamaları artık kesinleştirilebilir.',view:'admin'};
  const finalDone=state.matches.some(m=>m.stage==='final'&&m.status==='final'),thirdDone=state.matches.some(m=>m.stage==='third'&&m.status==='final');
  if(!finalDone||!thirdDone)return{label:'Final Eights',title:'İlk dört dereceyi belirleyin',detail:'Final ve üçüncülük maçları dâhil Final Eights aşamasını tamamlayın.',view:'finals'};
  if(state.matches.filter(m=>m.stage==='playout'&&m.status==='final').length<28)return{label:'Play-out',title:'Play-out maçlarını tamamlayın',detail:'Yeni sezon lig üyelikleri için 28 maçın tamamı gerekli.',view:'playouts'};
  return{label:'Sezon geçişi',title:'Yeni sezonu oluşturun',detail:'Bütün sportif sonuçlar tamamlandı.',view:'admin'};
}

function defaultLogoConfig(name='TK'){const initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase().slice(0,2)||'TK';const palette=[['#2563eb','#0f172a'],['#dc2626','#111827'],['#16a34a','#052e16'],['#7c3aed','#1e1b4b'],['#ea580c','#431407'],['#0891b2','#083344']];const pair=palette[Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length];return{shape:'shield',primaryColor:pair[0],secondaryColor:pair[1],borderColor:'#f8fafc',pattern:'split',initials,textColor:'#ffffff'}}
function generatedLogoSvg(c){const clipId=`clip-${Math.random().toString(36).slice(2,10)}`;const shape=c.shape||'shield';const path=shape==='circle'?'<circle cx="50" cy="50" r="43"/>':shape==='hexagon'?'<path d="M50 5 88 27v46L50 95 12 73V27z"/>':'<path d="M12 8h76v50c0 21-16 31-38 39C28 89 12 79 12 58z"/>';const clip=shape==='circle'?'<circle cx="50" cy="50" r="43"/>':shape==='hexagon'?'<path d="M50 5 88 27v46L50 95 12 73V27z"/>':'<path d="M12 8h76v50c0 21-16 31-38 39C28 89 12 79 12 58z"/>';let pattern='';if(c.pattern==='split')pattern=`<rect x="50" width="50" height="100" fill="var(--secondary)" clip-path="url(#${clipId})"/>`;if(c.pattern==='stripes')pattern=`<g clip-path="url(#${clipId})" fill="var(--secondary)"><rect x="20" width="15" height="100"/><rect x="50" width="15" height="100"/><rect x="80" width="15" height="100"/></g>`;return `<svg viewBox="0 0 100 100" role="img" aria-label="Kulüp arması" style="--secondary:${c.secondaryColor}"><defs><clipPath id="${clipId}">${clip}</clipPath></defs><g fill="${c.primaryColor}" stroke="${c.borderColor}" stroke-width="4">${path}</g>${pattern}<text x="50" y="59" text-anchor="middle" font-size="26" font-weight="900" fill="${c.textColor||'#fff'}" stroke="rgba(0,0,0,.25)" stroke-width="1">${escapeHtml(c.initials||'TK')}</text></svg>`}

/* v0.3 fikstür kilit motoru: H→G→F→E→D→C, ardından A/B haftalık grup döngüsü. */
function leagueGroupMatches(league,group=null,round=null){return state.matches.filter(m=>m.stage==='group'&&m.leagueCode===league&&(group==null||m.groupNumber===group)&&(round==null||m.roundNumber===round))}
function matchSetComplete(rows){return rows.length>0&&rows.every(m=>m.status==='final')}
function lowerLeagueComplete(league){return matchSetComplete(leagueGroupMatches(league))}
function currentLowerLeagueIndex(){for(let i=0;i<LOWER_LEAGUE_FLOW.length;i++)if(!lowerLeagueComplete(LOWER_LEAGUE_FLOW[i]))return i;return -1}
function lowerLeaguesComplete(){return currentLowerLeagueIndex()===-1}
function abStepIndexForMatch(m){if(!['A','B'].includes(m.leagueCode)||!m.groupNumber||!m.roundNumber)return-1;const within=AB_GROUP_FLOW.findIndex(([l,g])=>l===m.leagueCode&&g===m.groupNumber);return within<0?-1:(m.roundNumber-1)*AB_GROUP_FLOW.length+within}
function abStepMatches(index){if(index<0)return[];const round=Math.floor(index/AB_GROUP_FLOW.length)+1,[league,group]=AB_GROUP_FLOW[index%AB_GROUP_FLOW.length];return leagueGroupMatches(league,group,round)}
function currentABStepIndex(){for(let i=0;i<24;i++)if(!matchSetComplete(abStepMatches(i)))return i;return-1}
function groupMatchLockInfo(m){
  if(m.stage!=='group')return{unlocked:true,reason:''};
  if(LOWER_LEAGUE_FLOW.includes(m.leagueCode)){
    const current=currentLowerLeagueIndex(),target=LOWER_LEAGUE_FLOW.indexOf(m.leagueCode);
    if(current>=0&&target>current)return{unlocked:false,reason:`Önce ${LOWER_LEAGUE_FLOW[current]} Ligi grup maçları tamamen bitirilmelidir.`};
    return{unlocked:true,reason:''};
  }
  if(['A','B'].includes(m.leagueCode)){
    const lower=currentLowerLeagueIndex();
    if(lower>=0)return{unlocked:false,reason:`A ve B ligleri için önce ${LOWER_LEAGUE_FLOW[lower]} Ligi ve ardından C’ye kadar olan alt ligler tamamlanmalıdır.`};
    const current=currentABStepIndex(),target=abStepIndexForMatch(m);
    if(current>=0&&target>current){const r=Math.floor(current/8)+1,[l,g]=AB_GROUP_FLOW[current%8];return{unlocked:false,reason:`Önce ${r}. haftadaki ${l}${g} grubunun iki maçı kesinleştirilmelidir.`}}
    return{unlocked:true,reason:''};
  }
  return{unlocked:true,reason:''};
}
function fixtureFlowSortTuple(m){
  if(m.stage!=='group')return[2,stageOrder[m.stage]||99,m.roundNumber||0,m.displayOrder||0];
  if(LOWER_LEAGUE_FLOW.includes(m.leagueCode))return[0,LOWER_LEAGUE_FLOW.indexOf(m.leagueCode),m.roundNumber||0,m.groupNumber||0,m.displayOrder||0];
  if(['A','B'].includes(m.leagueCode))return[1,m.roundNumber||0,AB_GROUP_FLOW.findIndex(([l,g])=>l===m.leagueCode&&g===m.groupNumber),m.displayOrder||0];
  return[1,99,m.roundNumber||0,m.groupNumber||0,m.displayOrder||0];
}
function compareFixtureFlow(a,b){const x=fixtureFlowSortTuple(a),y=fixtureFlowSortTuple(b);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0}
function currentFixtureFlowDescription(){const lower=currentLowerLeagueIndex();if(lower>=0)return`Aktif sıra: ${LOWER_LEAGUE_FLOW[lower]} Ligi.`;const step=currentABStepIndex();if(step>=0){const round=Math.floor(step/8)+1,[l,g]=AB_GROUP_FLOW[step%8];return`Aktif sıra: ${round}. hafta ${l}${g} grubu.`}return'Tüm grup maçları tamamlandı.'}

function currentOpenMatchday(){
  if(!lowerLeaguesComplete())return 1;
  const step=currentABStepIndex();return step<0?3:Math.floor(step/8)+1;
}
function matchdaySummary(day){const rows=state.matches.filter(m=>m.stage==='group'&&m.roundNumber===day);return{total:rows.length,final:rows.filter(m=>m.status==='final').length}}
function isMatchdayUnlocked(){return true}
function priorMatchdaysComplete(day){return state.matches.filter(m=>m.stage==='group'&&['A','B'].includes(m.leagueCode)&&m.roundNumber<day).every(m=>m.status==='final')}
function logoHtml(team,size=''){if(!team)return`<div class="logo ${size}"></div>`;const fallback=team.logoConfig||defaultLogoConfig(team.name),glow=fallback.primaryColor||'var(--accent)';if(team.logoType==='uploaded'){const url=state.logoUrls.get(team.logoAssetId);return `<div class="logo ${size}" style="--team-glow:${escapeHtml(glow)}">${url?`<img src="${url}" alt="${escapeHtml(team.name)} arması">`:generatedLogoSvg(fallback)}</div>`}return `<div class="logo ${size}" style="--team-glow:${escapeHtml(glow)}">${generatedLogoSvg(fallback)}</div>`}

  [['fixture-stage','fixtureStage'],['fixture-league','fixtureLeague'],['fixture-group','fixtureGroup'],['fixture-round','fixtureRound'],['fixture-status','fixtureStatus']].forEach(([id,key])=>$('#'+id).onchange=e=>{state.filters[key]=e.target.value;renderFixtures()});

async function standingsForGroup(league,group,seasonId=state.activeSeason.seasonId){const allAssignments=(seasonId===state.activeSeason.seasonId?state.assignments:(await dbGetAll('assignments')).filter(a=>a.seasonId===seasonId)).filter(a=>a.leagueCode===league&&a.groupNumber===group);const allMatches=(seasonId===state.activeSeason.seasonId?state.matches:(await dbGetAll('matches')).filter(m=>m.seasonId===seasonId)).filter(m=>m.stage==='group'&&m.leagueCode===league&&m.groupNumber===group&&m.status==='final');const cards=(seasonId===state.activeSeason.seasonId?state.cardEvents:(await dbGetAll('cardEvents')).filter(e=>e.seasonId===seasonId));const table=new Map(allAssignments.map(a=>[a.teamId,{teamId:a.teamId,played:0,wins:0,draws:0,losses:0,gf:0,ga:0,gd:0,points:0,fairPlay:0,lotNumber:a.lotNumber||9999}]));for(const m of allMatches){const a=table.get(m.sideATeamId),b=table.get(m.sideBTeamId);if(!a||!b)continue;a.played++;b.played++;a.gf+=m.scoreA;a.ga+=m.scoreB;b.gf+=m.scoreB;b.ga+=m.scoreA;if(m.scoreA>m.scoreB){a.wins++;b.losses++;a.points+=3}else if(m.scoreA<m.scoreB){b.wins++;a.losses++;b.points+=3}else{a.draws++;b.draws++;a.points++;b.points++}}for(const r of table.values())r.gd=r.gf-r.ga;for(const e of cards){const m=allMatches.find(x=>x.matchId===e.matchId);if(!m)continue;const r=table.get(e.teamId);if(!r)continue;r.fairPlay+=cardWeight(e,cards.filter(x=>x.matchId===e.matchId&&x.playerId===e.playerId))}const rows=[...table.values()];return rankRows(rows,allMatches)}
function cardWeight(e,playerMatchCards){if(e.cardType==='yellow')return 1;if(e.cardType==='directRed')return 5;if(e.cardType==='secondYellowRed')return playerMatchCards.some(x=>x.cardType==='yellow')?2:3;return 0}
function rankRows(rows,matches){const byPoints=new Map();rows.forEach(r=>{if(!byPoints.has(r.points))byPoints.set(r.points,[]);byPoints.get(r.points).push(r)});const pointsGroups=[...byPoints.entries()].sort((a,b)=>b[0]-a[0]);const result=[];for(const [,group] of pointsGroups){if(group.length===1){result.push(group[0]);continue}for(const r of group){const ids=new Set(group.map(x=>x.teamId));let gd=0;for(const m of matches.filter(m=>ids.has(m.sideATeamId)&&ids.has(m.sideBTeamId))){if(m.sideATeamId===r.teamId)gd+=m.scoreA-m.scoreB;else if(m.sideBTeamId===r.teamId)gd+=m.scoreB-m.scoreA}r.h2hGd=gd}group.sort((a,b)=>(b.h2hGd-a.h2hGd)||(b.gd-a.gd)||(b.gf-a.gf)||(a.fairPlay-b.fairPlay)||(a.lotNumber-b.lotNumber));result.push(...group)}return result}

async function resolveStatsSeason(scope){if(scope==='season')return state.activeSeason;const seasons=(await dbGetAll('seasons')).sort((a,b)=>b.seasonNumber-a.seasonNumber);if(scope==='previous')return seasons.find(s=>s.seasonNumber<state.activeSeason.seasonNumber&&(s.status==='archived'||s.completedAt))||null;return null}

async function loadStats(tab,scope,league='all'){

async function clearActiveSeasonCompetition({keepAssignments=true,reason='manual_reset'}={}){const seasonId=state.activeSeason.seasonId;const [matches,goals,cards,injuries,draws,assignments,bests,transitions]=await Promise.all([dbGetAll('matches'),dbGetAll('goalEvents'),dbGetAll('cardEvents'),dbGetAll('injuryEvents'),dbGetAll('drawRecords'),dbGetAll('assignments'),dbGetAll('seasonBestElevens'),dbGetAll('seasonTransitions')]);const matchIds=new Set(matches.filter(m=>m.seasonId===seasonId).map(m=>m.matchId));const stores=['matches','goalEvents','cardEvents','injuryEvents','drawRecords','seasonBestElevens','seasonTransitions','seasons','auditEntries'];if(!keepAssignments)stores.push('assignments');const tr=tx(stores,'readwrite');matches.filter(m=>m.seasonId===seasonId).forEach(m=>tr.objectStore('matches').delete(m.matchId));goals.filter(e=>matchIds.has(e.matchId)||e.seasonId===seasonId).forEach(e=>tr.objectStore('goalEvents').delete(e.eventId));cards.filter(e=>matchIds.has(e.matchId)||e.seasonId===seasonId).forEach(e=>tr.objectStore('cardEvents').delete(e.eventId));injuries.filter(e=>matchIds.has(e.matchId)||e.seasonId===seasonId).forEach(e=>tr.objectStore('injuryEvents').delete(e.eventId));draws.filter(d=>d.seasonId===seasonId&&['group_fixture','final_eights','playout'].includes(d.drawType)).forEach(d=>tr.objectStore('drawRecords').delete(d.drawId));bests.filter(b=>b.seasonId===seasonId).forEach(b=>tr.objectStore('seasonBestElevens').delete(b.bestElevenId));transitions.filter(x=>x.fromSeasonId===seasonId).forEach(x=>tr.objectStore('seasonTransitions').delete(x.transitionId));if(!keepAssignments)assignments.filter(a=>a.seasonId===seasonId).forEach(a=>tr.objectStore('assignments').delete(a.assignmentId));const remainingAssignments=keepAssignments?assignments.filter(a=>a.seasonId===seasonId).length:0;const season={...state.activeSeason,status:remainingAssignments===128?'ready_for_fixture':'team_allocation',startedAt:null,completedAt:null,championTeamId:null,runnerUpTeamI nged=newTeams.length!==beforeTeams.length;p.teamsSeen=newTeams;if(p.currentTeamId===teamId){p.currentTeamId=null;changed=true}if(changed){p.updatedAt=now();tr.objectStore('players').put(p)}}draws.filter(d=>(d.participants||[]).includes(teamId)||JSON.stringify(d.result||'').includes(teamId)).forEach(d=>tr.objectStore('drawRecords').delete(d.drawId));transitions.filter(x=>JSON.stringify(x).includes(teamId)).forEach(x=>tr.objectStore('seasonTransitions').delete(x.transitionId));for(const s of seasons){let changed=false;for(const key of ['championTeamId','runnerUpTeamId','thirdPlaceTeamId','fourthPlaceTeamId'])if(s[key]===teamId){s[key]=null;changed=true}if(s.finalPlacements){for(const key of ['first','second','third','fourth'])if(s.finalPlacements[key]===teamId){s.finalPlacements[key]=null;changed=true}}if(changed){s.updatedAt=now();tr.objectStore('seasons').put(s)}}for(const b of bests){let changed=false;b.slots=(b.slots||[]).map(slot=>{if(slot.teamIdAtSelection===teamId){changed=true;return{...slot,teamIdAtSelection:null,teamNameSnapshot:slot.teamNameSnapshot||team.name}}return slot});if(changed){b.updatedAt=now();tr.objectStore('seasonBestElevens').put(b)}}tr.objectStore('teams').delete(teamId);if(team.logoAssetId&&!teams.some(t=>t.teamId!==teamId&&t.logoAssetId===team.logoAssetId))tr.objectStore('logoAssets').delete(team.logoAssetId);tr.objectStore('auditEntries').put({auditId:uid(),action:'delete_team',entityType:'team',entityId:teamId,summary:`${team.name} ve ilişkili maç/istatistik kayıtları silindi`,before:team,after:null,createdAt:now()});await transactionDone(tr);await syncActiveSeasonAllocationStatus();await reloadState();closeModal();renderAll();toast(`${team.name} ve ilişkili kayıtları silindi.`,'good',6000)}catch(err){console.error(err);toast(err.message||'Takım silinemedi.','bad',8000)}}

async function saveBestEleven(seasonId){const btn=$('#save-best-eleven');setBusy(btn,true);try{const names=$$('.best-eleven-player-input').map(x=>x.value.trim().replace(/\s+/g,' '));if(names.some(n=>!n))throw new Error('11 oyuncunun tamamı seçilmelidir.');const normalized=names.map(normalizeName);if(new Set(normalized).size!==11)throw new Error('Aynı oyuncu En İyi 11 içinde iki kez seçilemez.');const slots=[];for(let i=0;i<names.length;i++){const p=await getOrCreatePlayer(names[i],null);const teamId=p.currentTeamId||null;slots.push({slotNumber:i+1,role:bestElevenRoles($('#best-eleven-formation').value)[i],playerId:p.playerId,playerNameSnapshot:p.canonicalName,teamIdAtSelection:teamId,teamNameSnapshot:teamId?teamName(teamId):null})}const old=state.bestElevens.find(x=>x.seasonId===seasonId);const record={bestElevenId:old?.bestElevenId||uid(),seasonId,formation:$('#best-eleven-formation').value,slots,createdAt:old?.createdAt||now(),updatedAt:now()};await dbPut('seasonBestElevens',record);await audit(old?'update_best_eleven':'create_best_eleven','season',seasonId,'Sezonun En İyi 11 seçimi kaydedildi',old||null,record);await reloadState();closeModal();renderAll();toast('Sezonun En İyi 11’i kaydedildi.','good')}catch(err){console.error(err);toast(err.message||'En İyi 11 kaydedilemedi.','bad',7000)}finally{setBusy(btn,false)}}
function resizeImage(file,maxW,maxH){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,maxW/img.width,maxH/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error('Görsel dönüştürülemedi'))},'image/webp',.86)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Görsel açılamadı'))};img.src=url})}

async function syncActiveSeasonAllocationStatus(){const [allAssignments,allMatches]=await Promise.all([dbGetAll('assignments'),dbGetAll('matches')]);if(allMatches.some(m=>m.seasonId===state.activeSeason.seasonId))return;const count=allAssignments.filter(a=>a.seasonId===state.activeSeason.seasonId).length;const season=await dbGet('seasons',state.activeSeason.seasonId);if(!season||season.status==='archived')return;season.status=count===128?'ready_for_fixture':'team_allocation';season.revision=(season.revision||0)+1;await dbPut('seasons',season)}
async function assignSelectedTeam(){const teamId=$('#assign-team').value,league=$('#assign-league').value,group=Number($('#assign-group').value),slot=Number($('#assign-slot').value);if(!teamId)return toast('Takım seçin.','warn');if(state.assignments.some(a=>a.leagueCode===league&&a.groupNumber===group&&a.slotNumber===slot))return toast(`${league}${group} grubundaki ${slot}. yuva dolu.`,'bad');if(assignmentByTeam(teamId))return toast('Takım zaten atanmış.','bad');const a={assignmentId:uid(),seasonId:state.activeSeason.seasonId,teamId,leagueCode:league,groupNumber:group,slotNumber:slot,sourceType:'manual',sourceDrawId:null,teamNameSnapshot:teamName(teamId),logoSnapshot:null,lotNumber:randomLot(),createdAt:now(),updatedAt:now()};await dbPut('assignments',a);await syncActiveSeasonAllocationStatus();await audit('assign','assignment',a.assignmentId,`${teamName(teamId)} ${league}${group} grubuna yerleştirildi`,null,a);await reloadState();renderAll();toast('Takım yerleştirildi.','good')}
function randomLot(){const x=new Uint32Array(1);crypto.getRandomValues(x);return x[0]}
async function removeAssignment(id){const a=state.assignments.find(x=>x.assignmentId===id);if(!a)return;if(!confirmAction(`${teamName(a.teamId)} takımının ataması kaldırılsın mı?`))return;await dbDelete('assignments',id);await syncActiveSeasonAllocationStatus();await audit('remove','assignment',id,'Takım ataması kaldırıldı',a,null);await reloadState();renderAll();toast('Takım ataması kaldırıldı.','good')}
async function drawFixtures(){const btn=$('#draw-fixtures');setBusy(btn,true);try{const check=validateAllocation();if(!check.ok)throw new Error(check.errors.join(' '));const drawId=uid(),seed=randomSeed();const created=[];for(const league of LEAGUES){for(const group of GROUPS){const ids=shuffle(state.assignments.filter(a=>a.leagueCode===league&&a.groupNumber===group).map(a=>a.teamId));const rounds=shuffle([[[ids[0],ids[3]],[ids[1],ids[2]]],[[ids[0],ids[2]],[ids[3],ids[1]]],[[ids[0],ids[1]],[ids[2],ids[3]]]]);rounds.forEach((pairs,ri)=>pairs.forEach((pair,mi)=>{const flip=shuffle([true,false])[0];created.push({matchId:uid(),seasonId:state.activeSeason.seasonId,stage:'group',leagueCode:league,groupNumber:group,boundaryCode:null,roundNumber:ri+1,bracketSlot:null,displayOrder:mi+1,sideATeamId:flip?pair[1]:pair[0],sideBTeamId:flip?pair[0]:pair[1],status:'scheduled',scoreA:null,scoreB:null,extraTimeScoreA:null,extraTimeScoreB:null,penaltyScoreA:null,penaltyScoreB:null,winnerTeamId:null,statisticsComplete:false,finalizedAt:null,drawRecordId:drawId,revision:1})}))}}const validation=validateFixtureList(created);if(!validation.ok)throw new Error(validation.errors.join(' '));const tr=tx(['matches','drawRecords','seasons','auditEntries'],'readwrite');for(const m of created)tr.objectStore('matches').put(m);const draw={drawId,seasonId:state.activeSeason.seasonId,drawType:'group_fixture',participants:state.assignments.map(a=>a.teamId),pots:null,constraints:['Her takım haftada bir maç','Her eşleşme bir kez'],randomSeed:seed,algorithmVersion:'round-robin-1.0',result:created.map(m=>m.matchId),createdAt:now(),lockedAt:now(),status:'final'};tr.objectStore('drawRecords').put(draw);state.activeSeason.fixtureDrawId=drawId;state.activeSeason.status='group_stage';state.activeSeason.startedAt=state.activeSeason.startedAt||now();state.activeSeason.revision++;tr.objectStore('seasons').put(state.activeSeason);tr.objectStore('auditEntries').put({auditId:uid(),action:'draw_fixture',entityType:'season',entityId:state.activeSeason.seasonId,summary:'192 grup maçı oluşturuldu',createdAt:now()});await transactionDone(tr);await reloadState();renderAll();toast('32 grup için 192 maçlık fikstür oluşturuldu.','good')}catch(err){console.error(err);toast(err.message||'Fikstür oluşturulamadı.','bad',7000)}finally{setBusy(btn,false)}}
function validateAllocation(){const errors=[];const active=state.teams.filter(t=>t.status==='active');if(active.length!==128)errors.push('Tam olarak 128 aktif takım bulunmalıdır.');if(state.assignments.length!==128)errors.push('Tam olarak 128 takım ataması bulunmalıdır.');for(const l of LEAGUES)for(const g of GROUPS){const n=state.assignments.filter(a=>a.leagueCode===l&&a.groupNumber===g).length;if(n!==4)errors.push(`${l}${g} grubunda ${n} takım var.`)}if(new Set(state.assignments.map(a=>a.teamId)).size!==state.assignments.length)errors.push('Aynı takım birden fazla gruba atanmış.');return{ok:!errors.length,errors}}
function validateFixtureList(ms){const errors=[];if(ms.length!==192)errors.push(`192 yerine ${ms.length} maç üretildi.`);for(const l of LEAGUES)for(const g of GROUPS){const x=ms.filter(m=>m.leagueCode===l&&m.groupNumber===g);if(x.length!==6)errors.push(`${l}${g} için 6 maç yok.`);const pairs=new Set();const count=new Map();for(const m of x){const key=[m.sideATeamId,m.sideBTeamId].sort().join('|');if(pairs.has(key))errors.push(`${l}${g} grubunda tekrarlanan eşleşme.`);pairs.add(key);count.set(m.sideATeamId,(count.get(m.sideATeamId)||0)+1);count.set(m.sideBTeamId,(count.get(m.sideBTeamId)||0)+1)}for(const n of count.values())if(n!==3)errors.push(`${l}${g} grubunda bir takımın maç sayısı 3 değil.`);for(const r of [1,2,3]){const week=x.filter(m=>m.roundNumber===r);const ids=week.flatMap(m=>[m.sideATeamId,m.sideBTeamId]);if(week.length!==2||new Set(ids).size!==4)errors.push(`${l}${g} ${r}. hafta çakışmalı.`)}}return{ok:!errors.length,errors}}

async function requestAdminAccess(afterUnlock=null){if(afterUnlock)state.pendingAdminAction=afterUnlock;if(state.settings.adminPinHash){openPinModal('unlock')}else openPinModal('setup')}
function openPinModal(mode){$('#modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal small-modal"><div class="modal-head"><h3>${mode==='setup'?'Admin PIN Oluştur':'Admin Kilidini Aç'}</h3><button class="btn ghost" id="close-pin">×</button></div><form id="pin-form" action="javascript:void(0)" onsubmit="return false;"><div class="modal-body"><div class="field"><label>${mode==='setup'?'Yeni PIN (en az 4 hane)':'PIN'}</label><input id="pin-input" type="password" inputmode="numeric" minlength="4" required autofocus></div>${mode==='setup'?'<div class="alert warn small">Bu PIN gerçek sunucu güvenliği sağlamaz ve unutulursa kurtarılamaz. Yalnızca yerel düzenleme kilididir.</div>':''}</div><div class="modal-foot"><button class="btn" type="button" id="cancel-pin">İptal</button><button class="btn primary" type="submit">${mode==='setup'?'PIN’i Kaydet':'Kilidi Aç'}</button></div></form></div></div>`;$('#close-pin').onclick=$('#cancel-pin').onclick=closeModal;$('#pin-form').addEventListener('submit',async e=>{e.preventDefault();const pin=$('#pin-input').value;if(pin.length<4)return toast('PIN en az 4 karakter olmalıdır.','bad');if(mode==='setup'){const salt=uid();state.settings.adminPinSalt=salt;state.settings.adminPinHash=await hashPin(pin,salt);state.settings.updatedAt=now();await dbPut('settings',state.settings);state.adminUnlocked=true;closeModal();updateHeader();const action=state.pendingAdminAction;state.pendingAdminAction=null;if(action)action();else switchView('admin');toast('Admin PIN oluşturuldu.','good')}else{const h=await hashPin(pin,state.settings.adminPinSalt);if(h!==state.settings.adminPinHash)return toast('PIN yanlış.','bad');state.adminUnlocked=true;closeModal();updateHeader();const action=state.pendingAdminAction;state.pendingAdminAction=null;if(action)action();else switchView('admin')}});}
async function hashPin(pin,salt){const data=new TextEncoder().encode(`${salt}:${pin}`);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lockAdmin(silent=false){state.adminUnlocked=false;updateHeader();if(state.activeView==='admin')renderAdmin();if(!silent)toast('Admin paneli kilitlendi.','info')}

function openScoreEditor(matchId){
  if(!state.adminUnlocked){state.pendingMatchId=matchId;requestAdminAccess(()=>{const id=state.pendingMatchId;state.pendingMatchId=null;openScoreEditor(id)});return}
  const m=matchById(matchId);if(!m)return toast('Maç bulunamadı.','bad');

  const matchMap=new Map((out.matches||[]).map(m=>[m.matchId,m]));

  out.seasons=(out.seasons||[]).map(s=>({...s,runnerUpTeamId:s.runnerUpTeamId||s.finalPlacements?.second||null,thirdPlaceTeamId:s.thirdPlaceTeamId||s.finalPlacements?.third||null,fourthPlaceTeamId:s.fourthPlaceTeamId||s.finalPlacements?.fourth||null,finalPlacements:s.finalPlacements||{first:s.championTeamId||null,second:s.runnerUpTeamId||null,third:s.thirdPlaceTeamId||null,fourth:s.fourthPlaceTeamId||null}}));

function setBusy(btn,busy,label='İşleniyor…'){if(!btn)return;btn.disabled=busy;btn.classList.toggle('is-busy',busy);if(busy){btn.dataset.oldText=btn.innerHTML;btn.innerHTML=`<span class="spinner" aria-hidden="true"></span>${escapeHtml(label)}`}else if(btn.dataset.oldText){btn.innerHTML=btn.dataset.oldText;delete btn.dataset.oldText}}
function toast(message,type='info',timeout=3600,action=null){
  const stack=$('#toast-stack');if(!stack)return;const el=document.createElement('div');el.className=`toast ${type}`;el.setAttribute('role',type==='bad'?'alert':'status');el.style.setProperty('--toast-time',`${timeout}ms`);
  el.innerHTML=`<div>${escapeHtml(message)}</div>${action?`<button class="toast-action" type="button">${escapeHtml(action.label||'Geri Al')}</button>`:''}<button class="toast-close" type="button" aria-label="Bildirimi kapat">×</button><span class="toast-progress"></span>`;
  const remove=()=>{if(el.classList.contains('removing'))return;el.classList.add('removing');setTimeout(()=>el.remove(),220)};el.querySelector('.toast-close').onclick=remove;if(action)el.querySelector('.toast-action').onclick=async()=>{try{await action.onClick?.();remove()}catch(err){console.error(err)}};stack.append(el);setTimeout(remove,timeout);return el
}

async function ensurePremiumDefaults(){
  const s=await dbGet('settings','main');if(!s)return;let changed=false;const defaults={soundEnabled:false,showTooltips:true,celebrationEnabled:true,exportFormat:'pretty',quickScoreAutoFocus:true};for(const [k,v] of Object.entries(defaults))if(s[k]===undefined){s[k]=v;changed=true}if(changed){s.updatedAt=now();await dbPut('settings',s)}
  const [matches,teams,seasons]=await Promise.all([dbGetAll('matches'),dbGetAll('teams'),dbGetAll('seasons')]);const changedMatches=[],changedTeams=[],changedSeasons=[];
  for(const m of matches){let c=false;if(m.notes===undefined){m.notes='';c=true}if(m.manOfMatchPlayerId===undefined){m.manOfMatchPlayerId=null;c=true}if(m.manOfMatchNameSnapshot===undefined){m.manOfMatchNameSnapshot='';c=true}if(m.reportSummary===undefined){m.reportSummary='';c=true}if(c)changedMatches.push(m)}
  for(const t of teams)if(t.notes===undefined){t.notes='';changedTeams.push(t)}
  for(const s2 of seasons)if(s2.summaryAwards===undefined){s2.summaryAwards=null;changedSeasons.push(s2)}
  if(changedMatches.length||changedTeams.length||changedSeasons.length){const mt=tx(['matches','teams','seasons'],'readwrite');changedMatches.forEach(x=>mt.objectStore('matches').put(x));changedTeams.forEach(x=>mt.objectStore('teams').put(x));changedSeasons.forEach(x=>mt.objectStore('seasons').put(x));await transactionDone(mt)}
}

async function initialize(){try{state.db=await openDB();await ensureDefaults();await migrateDatabase();await ensurePremiumDefaults();await reloadState();document.body.classList.toggle('tooltips-off',state.settings.showTooltips===false);document.body.classList.toggle('reduce-motion',!!state.settings.reducedMotion);bindShell();bindPremiumShell();renderAll();$('#db-health').textContent='IndexedDB hazır · Premium';}catch(err){console.error(err);$('#db-health').textContent='Veritabanı hatası';toast('IndexedDB başlatılamadı. Tarayıcı depolama izinlerini kontrol edin.','bad',8000)}}

function bindPremiumShell(){
  document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');if(e.altKey&&!typing){if(e.key.toLowerCase()==='s'){e.preventDefault();switchView('fixtures')}if(e.key.toLowerCase()==='i'){e.preventDefault();switchView('statentry')}if(e.key.toLowerCase()==='p'){e.preventDefault();switchView('standings')}}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const primary=$('#finalize-match')||$('#save-statistics')||$('#save-team-editor');if(primary&&!primary.disabled){e.preventDefault();primary.click()}}if(e.key==='Escape'&&$('#modal-root')?.children.length)closeModal()});
  window.addEventListener('beforeunload',e=>{if(state.statsDirty){e.preventDefault();e.returnValue=''}});

function switchView(view){
  if(state.statsDirty&&view!==state.activeView){if(!confirmAction('İstatistik formunda kaydedilmemiş değişiklikler var. Değişiklikleri iptal edip devam edilsin mi?'))return;state.statsDirty=false;state.statsDirtyMatchId=null}
  if(['admin','statentry'].includes(view)&&!state.adminUnlocked){requestAdminAccess(()=>switchView(view));return}
  const apply=()=>{state.activeView=view;$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));$$('#nav button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#sidebar').classList.remove('open');renderView(view)};
  if(document.startViewTransition&&!state.settings?.reducedMotion)document.startViewTransition(apply);else apply()
}

function currentFlowNodes(){
  const lowerIndex=currentLowerLeagueIndex(),nodes=[];LOWER_LEAGUE_FLOW.forEach((l,i)=>nodes.push({key:l,label:l+' Ligi',detail:lowerLeagueComplete(l)?'Tamamlandı':i===lowerIndex?'Aktif':'Kilitli',state:lowerLeagueComplete(l)?'done':i===lowerIndex?'active':'locked'}));
  for(let day=1;day<=3;day++){const steps=AB_GROUP_FLOW.map(([l,g])=>({l,g,index:(day-1)*8+AB_GROUP_FLOW.findIndex(([x,y])=>x===l&&y===g)}));for(const st of steps){const rows=abStepMatches(st.index),done=matchSetComplete(rows),current=lowerLeaguesComplete()?currentABStepIndex():-2;nodes.push({key:`${st.l}${st.g}-${day}`,label:`${st.l}${st.g}`,detail:`${day}. hafta`,state:done?'done':st.index===current?'active':'locked'})}}
  return nodes
}

function bracketMatch(m,label){if(!m)return`<div class="match-card" data-reveal><div class="small muted">${label}</div><div class="match-side">Belirlenecek</div><div class="match-side">Belirlenecek</div></div>`;const eff=effectiveScore(m);return `<button class="match-card" data-reveal style="color:inherit;text-align:left" data-bracket-match="${m.matchId}"><div class="small muted">${label}</div><div class="match-side ${m.winnerTeamId===m.sideATeamId?'winner':''}"><span>${escapeHtml(teamName(m.sideATeamId))}</span><strong>${m.status==='scheduled'?'—':eff.a}</strong></div><div class="match-side ${m.winnerTeamId===m.sideBTeamId?'winner':''}"><span>${escapeHtml(teamName(m.sideBTeamId))}</span><strong>${m.status==='scheduled'?'—':eff.b}</strong></div>${m.extraTimeScoreA!=null?`<div class="small muted">90 dk: ${m.scoreA}-${m.scoreB} · Uzatma: ${m.extraTimeScoreA}-${m.extraTimeScoreB}</div>`:''}${m.penaltyScoreA!=null?`<div class="small muted">Penaltılar: ${m.penaltyScoreA}-${m.penaltyScoreB}</div>`:''}${m.manOfMatchPlayerId?`<div class="small motm-star">★ ${escapeHtml(m.manOfMatchNameSnapshot||'Maçın Adamı')}</div>`:''}</button>`}
function drawBracketConnectors(){const shell=$('.bracket-shell'),svg=$('.bracket-connections');if(!shell||!svg||innerWidth<=1024)return;const cards=$$('.match-card',shell),rect=shell.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);const byRound=r=>$$(`[data-round="${r}"] .match-card`,shell);const paths=[];const connect=(a,b)=>{if(!a||!b)return;const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),x1=ar.right-rect.left,y1=ar.top+ar.height/2-rect.top,x2=br.left-rect.left,y2=br.top+br.height/2-rect.top,mx=(x1+x2)/2;paths.push(`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`)};const q=byRound('qf'),s=byRound('sf'),f=byRound('final');connect(q[0],s[0]);connect(q[1],s[0]);connect(q[2],s[1]);connect(q[3],s[1]);connect(s[0],f[0]);connect(s[1],f[0]);svg.innerHTML=paths.join('')}

function teamFormSnapshot(teamId){const rows=state.matches.filter(m=>m.status==='final'&&(m.sideATeamId===teamId||m.sideBTeamId===teamId)).sort((a,b)=>String(b.finalizedAt).localeCompare(String(a.finalizedAt))).slice(0,5);let pts=0,gf=0,ga=0;const form=rows.map(m=>{const a=m.sideATeamId===teamId,forGoals=a?effectiveScore(m).a:effectiveScore(m).b,against=a?effectiveScore(m).b:effectiveScore(m).a;gf+=forGoals;ga+=against;if(forGoals>against){pts+=3;return'W'}if(forGoals===against){pts++;return'D'}return'L'});const power=clamp(Math.round(45+(pts/Math.max(1,rows.length*3))*40+clamp(gf-ga,-10,10)*1.5),1,99);return{form,power,played:rows.length}}

function normalizeImportedPayload(data){const version=Number(data.schemaVersion||1);if(version>SCHEMA_VERSION)throw new Error(`Bu dosya daha yeni bir şema sürümü kullanıyor: ${version}`);const out={...data};for(const s of STORES)if(!Array.isArray(out[s]))out[s]=[];out.matches=(out.matches||[]).map(m=>({...m,extraTimeScoreA:m.extraTimeScoreA??null,extraTimeScoreB:m.extraTimeScoreB??null,statisticsComplete:m.statisticsComplete??false,notes:m.notes||'',manOfMatchPlayerId:m.manOfMatchPlayerId||null,manOfMatchNameSnapshot:m.manOfMatchNameSnapshot||'',reportSummary:m.reportSummary||''}));const matchMap=new Map((out.matches||[]).map(m=>[m.matchId,m]));out.goalEvents=(out.goalEvents||[]).map(e=>{const m=matchMap.get(e.matchId),scorerTeamId=e.scorerTeamId||(e.goalType==='ownGoal'&&m?(e.creditedTeamId===m.sideATeamId?m.sideBTeamId:m.sideATeamId):e.creditedTeamId);return{...e,scorerTeamId,assistTeamId:e.assistPlayerId?(e.assistTeamId||e.creditedTeamId):null}});out.players=(out.players||[]).map(p=>({...p,teamsSeen:(p.teamsSeen||[]).filter(Boolean),currentTeamId:p.currentTeamId||null}));out.teams=(out.teams||[]).map(t=>({...t,notes:t.notes||''}));out.seasons=(out.seasons||[]).map(s=>({...s,runnerUpTeamId:s.runnerUpTeamId||s.finalPlacements?.second||null,thirdPlaceTeamId:s.thirdPlaceTeamId||s.finalPlacements?.third||null,fourthPlaceTeamId:s.fourthPlaceTeamId||s.finalPlacements?.fourth||null,summaryAwards:s.summaryAwards||null,finalPlacements:s.finalPlacements||{first:s.championTeamId||null,second:s.runnerUpTeamId||null,third:s.thirdPlaceTeamId||null,fourth:s.fourthPlaceTeamId||null}}));const settings=out.settings.find(s=>s.settingsId==='main');if(settings)settings.dataSchemaVersion=Math.min(version,SCHEMA_VERSION);out.schemaVersion=SCHEMA_VERSION;return out}
async function importData(file){if(!file)return;try{let text=await file.text(),raw=JSON.parse(text);if(raw.encrypted){const password=prompt('Bu yedek şifreli. Parolayı girin:')||'';try{text=await decryptBackup(raw,password);raw=JSON.parse(text)}catch{throw new Error('Parola yanlış veya şifreli dosya bozuk.')}}const data=normalizeImportedPayload(raw);for(const s of STORES)if(!Array.isArray(data[s]))throw new Error(`${s} koleksiyonu eksik.`);if(!confirmAction('İçe aktarma mevcut veritabanının tamamını değiştirecek. Devam edilsin mi?'))return;const rollbackData={};for(const s of STORES.filter(x=>x!=='rollbackSnapshots'))rollbackData[s]=await dbGetAll(s);const rollback={snapshotId:uid(),reason:'before_import',createdAt:now(),data:rollbackData},tr=tx(STORES,'readwrite');for(const s of STORES)tr.objectStore(s).clear();for(const s of STORES)for(const rawItem of data[s]){const item={...rawItem};if(s==='logoAssets'&&item.blobDataUrl){item.blob=dataUrlToBlob(item.blobDataUrl);delete item.blobDataUrl}tr.objectStore(s).put(item)}tr.objectStore('rollbackSnapshots').put(rollback);await transactionDone(tr);await migrateDatabase(true);await ensurePremiumDefaults();await reloadState();renderAll();toast('Yedek başarıyla geri yüklendi ve premium veri modeline dönüştürüldü.','good',7000)}catch(err){console.error(err);toast(err.message||'JSON içe aktarılamadı.','bad',8000)}}

function renderSettings(){const s=state.settings;$('#view-settings').innerHTML=`<div class="page-head"><div><h2>Yedekleme ve Premium Ayarlar</h2><p>Görsel deneyim, sesler, erişilebilirlik ve veri güvenliği.</p></div></div><div class="grid cols-2"><div class="card"><h3>Gelişmiş JSON Yedekleme</h3><div class="field"><label>Dışa aktarma biçimi</label><select id="export-format"><option value="pretty" ${s.exportFormat==='pretty'?'selected':''}>Okunabilir JSON</option><option value="compact" ${s.exportFormat==='compact'?'selected':''}>Küçük boyutlu JSON</option><option value="encrypted" ${s.exportFormat==='encrypted'?'selected':''}>Parola ile şifreli JSON</option></select></div><div class="form-actions" style="justify-content:flex-start"><button class="btn primary" id="export-settings">Dışa Aktar</button><label class="btn">İçe Aktar<input id="import-file" type="file" accept="application/json" hidden></label></div><div class="small muted" style="margin-top:10px">Son yedek: ${s.lastExportedAt?formatDate(s.lastExportedAt):'Henüz alınmadı'}</div></div><div class="card"><h3>Görünüm ve Hareket</h3><div class="field"><label>Tema</label><select id="theme-select"><option value="dark" ${s.theme==='dark'?'selected':''}>Koyu</option><option value="light" ${s.theme==='light'?'selected':''}>Açık</option></select></div><div class="setting-switch"><span>Animasyonları azalt</span><input id="reduced-motion" type="checkbox" ${s.reducedMotion?'checked':''}></div><div class="setting-switch"><span>Şampiyonluk kutlamaları</span><input id="celebration-enabled" type="checkbox" ${s.celebrationEnabled!==false?'checked':''}></div><div class="setting-switch"><span>İpucu baloncukları</span><input id="tooltips-enabled" type="checkbox" ${s.showTooltips!==false?'checked':''}></div></div><div class="card"><h3>Ses ve Hızlı Giriş</h3><div class="setting-switch"><span>İsteğe bağlı ses efektleri</span><input id="sound-enabled" type="checkbox" ${s.soundEnabled?'checked':''}></div><div class="setting-switch"><span>Skor alanına otomatik odak</span><input id="score-autofocus" type="checkbox" ${s.quickScoreAutoFocus!==false?'checked':''}></div><div class="alert info small">Klavye: Alt+S Fikstür, Alt+I İstatistik Girişi, Alt+P Puan Durumu, Ctrl+Enter Kaydet.</div></div><div class="card"><h3>Admin kilidi</h3><div class="field"><label>Otomatik kilit süresi</label><select id="lock-minutes"><option value="5" ${s.autoLockMinutes===5?'selected':''}>5 dakika</option><option value="15" ${s.autoLockMinutes===15?'selected':''}>15 dakika</option><option value="30" ${s.autoLockMinutes===30?'selected':''}>30 dakika</option><option value="60" ${s.autoLockMinutes===60?'selected':''}>60 dakika</option></select></div><button class="btn" id="change-pin" style="margin-top:10px">PIN’i değiştir</button><button class="btn" id="settings-health" style="margin-top:10px">Veri sağlığını kontrol et</button></div></div>`;$('#export-settings').onclick=()=>exportData($('#export-format').value);$('#import-file').onchange=e=>importData(e.target.files[0]);const saveSetting=async(k,v)=>{s[k]=v;s.updatedAt=now();await dbPut('settings',s)};$('#export-format').onchange=e=>saveSetting('exportFormat',e.target.value);$('#theme-select').onchange=async e=>{await saveSetting('theme',e.target.value);document.documentElement.dataset.theme=e.target.value};$('#reduced-motion').onchange=async e=>{await saveSetting('reducedMotion',e.target.checked);document.body.classList.toggle('reduce-motion',e.target.checked)};$('#celebration-enabled').onchange=e=>saveSetting('celebrationEnabled',e.target.checked);$('#tooltips-enabled').onchange=async e=>{await saveSetting('showTooltips',e.target.checked);document.body.classList.toggle('tooltips-off',!e.target.checked)};$('#sound-enabled').onchange=async e=>{await saveSetting('soundEnabled',e.target.checked);if(e.target.checked)playPremiumSound('save')};$('#score-autofocus').onchange=e=>saveSetting('quickScoreAutoFocus',e.target.checked);$('#lock-minutes').onchange=e=>saveSetting('autoLockMinutes',Number(e.target.value));$('#change-pin').onclick=()=>{if(state.adminUnlocked)openPinModal('setup');else requestAdminAccess(()=>openPinModal('setup'))};$('#settings-health').onclick=runHealthCheck}


/* Aynı yerel HTML dosyasına yanlışlıkla yönlenen bağlantıları engeller. */
document.addEventListener('click', function (event) {
  const anchor = event.target && event.target.closest ? event.target.closest('a[href]') : null;
  if (!anchor) return;
  const rawHref = anchor.getAttribute('href');
  if (!rawHref || rawHref === '#') {
    event.preventDefault();
    return;
  }
  try {
    const targetUrl = new URL(rawHref, window.location.href);
    if (window.location.protocol === 'file:' && targetUrl.protocol === 'file:' && targetUrl.href === window.location.href) {
      event.preventDefault();
    }
  } catch (_) {
    /* Geçersiz URL uygulamanın geri kalanını etkilemesin. */
  }
}, true);

/* Uygulama başlangıcı: file://, localhost ve GitHub Pages ortamlarında tek kez çalışır. */
let __gclBootStarted = false;
async function bootGlobalClubLeague(){
  if (__gclBootStarted) return;
  __gclBootStarted = true;
  try {
    await initialize();
  } catch (error) {
    __gclBootStarted = false;
    console.error('Uygulama başlatılamadı:', error);
  }
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootGlobalClubLeague, { once: true });
} else {
  bootGlobalClubLeague();
}
